<script type="importmap">
{

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================
//  utils & procedural noise
// =====================================================================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261124);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const wrapAng = (a) => Math.atan2(Math.sin(a), Math.cos(a));

function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const x00 = lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u);
  const x10 = lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u);
  const x01 = lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u);
  const x11 = lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm(x, y, z, oct = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * (vnoise(x * f, y * f, z * f) * 2 - 1); a *= 0.5; f *= 2.02; } return s; }
function distSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az; const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}

const GLSL_NOISE = /* glsl */`
  float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash12(i), hash12(i+vec2(1.0,0.0)), u.x), mix(hash12(i+vec2(0.0,1.0)), hash12(i+vec2(1.0,1.0)), u.x), u.y); }
  float fbm2(vec2 p){ float s = 0.0, a = 0.5; for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + vec2(1.7,9.2); a *= 0.5; } return s; }
`;

// =====================================================================
//  renderer / scene / camera
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf6d3ae, 55, 170);
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 700);

const U = { time: { value: 0 }, px: { value: 1000 } };
const SUN = new THREE.Vector3(0.72, 0.5, 0.3).normalize();

// ---------- sky dome (warm afternoon gradient + sun glow)
{
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTop: { value: new THREE.Color(0x5b95d0) }, uHor: { value: new THREE.Color(0xffd6aa) }, uBot: { value: new THREE.Color(0xe8b48a) }, uSun: { value: SUN } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 uTop, uHor, uBot, uSun; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = h > 0.0 ? mix(uHor, uTop, pow(clamp(h,0.0,1.0), 0.55)) : mix(uHor, uBot, pow(clamp(-h,0.0,1.0), 0.45));
        float s = max(dot(d, uSun), 0.0);
        col += vec3(1.0, 0.78, 0.5) * (pow(s, 900.0) * 4.0 + pow(s, 40.0) * 0.35 + pow(s, 6.0) * 0.12);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(450, 48, 24), skyMat));
}

// ---------- lights: warm low afternoon sun + sky/ground bounce
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0xd29d6e, 0.85));
const sun = new THREE.DirectionalLight(0xffd09a, 3.3);
sun.position.copy(SUN).multiplyScalar(45);
sun.target.position.set(0, -0.5, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 8, far: 95 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xa9c6ff, 0.35);
fill.position.set(-20, -6, -14);
scene.add(fill);

const island = new THREE.Group();
scene.add(island);

// =====================================================================
//  island layout (heightfield)
// =====================================================================
const PLAT = { x: -2.8, z: -3.1, r: 3.1, h: 3.6 };
const POND = { x: -2.8, z: -3.3, r: 1.35, water: 3.42, bed: 2.85 };
const POOL = { x: -2.8, z: 2.15, r: 1.7, water: 0.06, bed: -0.5 };
const STREAM_END_WATER = -0.06;
const TH_S = Math.atan2(0.9, -0.44);              // angle where the stream spills off the rim
const WIN = { x: 3.4, z: 0.9, rot: 0.62 };        // windmill

function rimR(th) { return 8.6 * (1 + 0.07 * Math.sin(3 * th + 0.7) + 0.045 * Math.sin(5 * th + 2.1) + 0.025 * Math.sin(9 * th + 0.3)); }
function plateauF(x, z) {
  const dx = x - PLAT.x, dz = z - PLAT.z, d = Math.hypot(dx, dz), a = Math.atan2(dz, dx);
  const r = PLAT.r * (1 + 0.09 * Math.sin(3 * a + 1.3) + 0.06 * Math.sin(5 * a + 0.4));
  return 1 - smoothstep(r - 0.45, r + 0.3, d);
}
function meadow(x, z) {
  return 0.36 + 0.22 * fbm(x * 0.17, 0.0, z * 0.17, 4) + 0.07 * fbm(x * 0.7, 3.1, z * 0.7, 3)
       + 1.0 * Math.exp(-((x - 3.6) ** 2 + (z + 3.8) ** 2) / 9);
}
WIN.y = meadow(WIN.x, WIN.z);

// ---------- stream path (lower pool -> rim)
const E = new THREE.Vector3(Math.cos(TH_S) * rimR(TH_S), 0, Math.sin(TH_S) * rimR(TH_S));
const streamCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(POOL.x, 0, POOL.z), new THREE.Vector3(-2.3, 0, 3.9), new THREE.Vector3(-3.2, 0, 5.6), E.clone()
], false, 'centripetal');
const SP = []; const N_S = 80;
for (let i = 0; i <= N_S; i++) { const p = streamCurve.getPointAt(i / N_S); SP.push([p.x, p.z]); }
const tanEnd = streamCurve.getTangentAt(1);
const dirE = new THREE.Vector3(tanEnd.x, 0, tanEnd.z).normalize();
SP.push([E.x + dirE.x * 1.2, E.z + dirE.z * 1.2]);
const SPcum = [0]; for (let i = 1; i < SP.length; i++) SPcum.push(SPcum[i - 1] + Math.hypot(SP[i][0] - SP[i - 1][0], SP[i][1] - SP[i - 1][1]));
const streamLen = SPcum[N_S];
const SPbox = SP.reduce((b, p) => [Math.min(b[0], p[0]), Math.max(b[1], p[0]), Math.min(b[2], p[1]), Math.max(b[3], p[1])], [1e9, -1e9, 1e9, -1e9]);
function streamDist(x, z) {
  if (x < SPbox[0] - 1.2 || x > SPbox[1] + 1.2 || z < SPbox[2] - 1.2 || z > SPbox[3] + 1.2) return { d: 99, s: 0 };
  let best = 1e9, bs = 0;
  for (let i = 0; i < SP.length - 1; i++) {
    const ax = SP[i][0], az = SP[i][1], dx = SP[i + 1][0] - ax, dz = SP[i + 1][1] - az, L2 = dx * dx + dz * dz;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / L2, 0, 1);
    const d2 = (x - ax - dx * t) ** 2 + (z - az - dz * t) ** 2;
    if (d2 < best) { best = d2; bs = (SPcum[i] + t * Math.sqrt(L2)) / streamLen; }
  }
  return { d: Math.sqrt(best), s: bs };
}

function H(x, z) {
  const th = Math.atan2(z, x), rn = Math.hypot(x, z) / rimR(th);
  let h = meadow(x, z);
  const dW = Math.hypot(x - WIN.x, z - WIN.z);
  if (dW < 2.0) h = lerp(h, WIN.y, smoothstep(2.0, 1.2, dW));
  const p = plateauF(x, z);
  if (p > 0) {
    const top = PLAT.h + 0.13 * fbm(x * 0.45, 7.7, z * 0.45, 3);
    h = lerp(h, top, p);
    h += p * (1 - p) * 4 * 0.45 * fbm(x * 1.1, 1.7, z * 1.1, 3);   // rocky cliff ledges
  }
  let d = Math.hypot(x - POND.x, z - POND.z);
  if (d < POND.r + 0.4) h = lerp(h, POND.bed + 0.35 * (d / POND.r) ** 2, smoothstep(POND.r + 0.3, POND.r - 0.5, d));
  const dc = distSeg(x, z, POND.x, POND.z, POND.x, POND.z + 5.0);  // spill channel to the cliff lip
  if (dc < 0.75) { const bedC = POND.water - 0.17; if (h > bedC) h = lerp(h, bedC, 1 - smoothstep(0.3, 0.7, dc)); }
  d = Math.hypot(x - POOL.x, z - POOL.z);
  if (d < POOL.r + 0.4) h = lerp(h, POOL.bed + 0.4 * (d / POOL.r) ** 2, smoothstep(POOL.r + 0.3, POOL.r - 0.5, d));
  const st = streamDist(x, z);
  if (st.d < 0.8) {
    const bed = lerp(POOL.water, STREAM_END_WATER, clamp(st.s, 0, 1)) - 0.2;
    if (h > bed) h = lerp(h, bed, 1 - smoothstep(0.28, 0.68, st.d));
  }
  const notch = 1 - smoothstep(0.07, 0.17, Math.abs(wrapAng(th - TH_S)));
  h -= 0.4 * smoothstep(0.84, 1.0, rn) * (1 - notch);
  return h;
}
const notchAt = (th) => 1 - smoothstep(0.07, 0.17, Math.abs(wrapAng(th - TH_S)));

// ---------- waterfall geometry anchors
let lipZ = POND.z + POND.r;
while (H(POND.x, lipZ) > POND.water - 0.29 && lipZ < 3) lipZ += 0.01;
const LIP = new THREE.Vector3(POND.x, POND.water, lipZ - 0.06);
const G = 9.8, VH_MAIN = 1.7;
const T_MAIN = Math.sqrt(2 * (POND.water - POOL.water) / G);
const IMPACT = new THREE.Vector3(LIP.x, POOL.water, LIP.z + VH_MAIN * T_MAIN);
const E_WATER = STREAM_END_WATER + 0.012;
const VH_EDGE = 1.6, T_EDGE = 1.5;
const edgeFallAt = (t, out) => out.set(E.x + dirE.x * VH_EDGE * t, E_WATER - 0.5 * G * t * t, E.z + dirE.z * VH_EDGE * t);

// ---------- bridge & dirt path
const BR = streamCurve.getPointAt(0.52);
const brTan = streamCurve.getTangentAt(0.52);
const brSide = new THREE.Vector3(-brTan.z, 0, brTan.x).normalize();
if (brSide.x * (WIN.x - BR.x) + brSide.z * (WIN.z - BR.z) < 0) brSide.negate();
const winFacing = new THREE.Vector3(Math.sin(WIN.rot), 0, Math.cos(WIN.rot));
const pathCurves = [
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(WIN.x + winFacing.x * 1.35, 0, WIN.z + winFacing.z * 1.35),
    new THREE.Vector3(1.2, 0, 3.7),
    new THREE.Vector3(BR.x + brSide.x * 1.3, 0, BR.z + brSide.z * 1.3)]),
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(BR.x - brSide.x * 1.3, 0, BR.z - brSide.z * 1.3),
    new THREE.Vector3(-5.0, 0, 3.6),
    new THREE.Vector3(-6.2, 0, 3.9)])
];
const PATH = pathCurves.map(c => c.getPoints(40).map(p => [p.x, p.z]));
function pathDist(x, z) {
  let best = 1e9;
  for (const pl of PATH) for (let i = 0; i < pl.length - 1; i++) best = Math.min(best, distSeg(x, z, pl[i][0], pl[i][1], pl[i + 1][0], pl[i + 1][1]));
  return best;
}

// =====================================================================
//  island terrain: grassy top (smooth) + rocky floating underside (faceted)
// =====================================================================
const NR = 76, NS = 210, NB = 30;
const ringTop = [];       // rim positions
const underRings = [];    // underside rings
{
  const pos = [], idx = [];
  pos.push(0, H(0, 0), 0);
  for (let i = 1; i <= NR; i++) {
    for (let j = 0; j < NS; j++) {
      const th = j / NS * Math.PI * 2, r = rimR(th) * i / NR;
      const x = Math.cos(th) * r, z = Math.sin(th) * r, y = H(x, z);
      pos.push(x, y, z);
      if (i === NR) ringTop.push(new THREE.Vector3(x, y, z));
    }
  }
  const id = (i, j) => i === 0 ? 0 : 1 + (i - 1) * NS + ((j % NS) + NS) % NS;
  for (let j = 0; j < NS; j++) idx.push(0, id(1, j + 1), id(1, j));
  for (let i = 1; i < NR; i++) for (let j = 0; j < NS; j++) {
    const a = id(i, j), b = id(i, j + 1), c = id(i + 1, j), d = id(i + 1, j + 1);
    idx.push(a, b, d, a, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const nrm = geo.attributes.normal, P = geo.attributes.position;
  const col = new Float32Array(P.count * 3);
  const cGA = new THREE.Color(0x6aa640), cGB = new THREE.Color(0x9cc455), cGold = new THREE.Color(0xc7b459);
  const cR1 = new THREE.Color(0xa08d78), cR2 = new THREE.Color(0x7a6a5c), cSand = new THREE.Color(0xcdb68a), cWet = new THREE.Color(0x6f6248);
  const cPath = new THREE.Color(0xc9a979), cSoil = new THREE.Color(0x6b4f37);
  const c = new THREE.Color(), tmp = new THREE.Color();
  for (let i = 0; i < P.count; i++) {
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i), ny = nrm.getY(i);
    const rn = Math.hypot(x, z) / rimR(Math.atan2(z, x));
    c.copy(cGA).lerp(cGB, fbm(x * 0.35, 2.2, z * 0.35, 3) * 0.7 + 0.5);
    c.lerp(cGold, smoothstep(0.1, 0.45, fbm(x * 0.15, 9, z * 0.15, 2)) * 0.55);
    const rockT = smoothstep(0.82, 0.58, ny);
    if (rockT > 0) { tmp.copy(cR1).lerp(cR2, vnoise(x * 1.5, y * 2.5, z * 1.5)); c.lerp(tmp, rockT); }
    const wet = (wy) => { tmp.copy(cSand).lerp(cWet, smoothstep(wy, wy - 0.35, y)); c.lerp(tmp, smoothstep(wy + 0.07, wy - 0.06, y)); };
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.35 || (distSeg(x, z, POND.x, POND.z, POND.x, LIP.z) < 0.7 && y > 3)) wet(POND.water);
    if (Math.hypot(x - POOL.x, z - POOL.z) < POOL.r + 0.4) wet(POOL.water);
    const st = streamDist(x, z);
    if (st.d < 0.8) wet(lerp(POOL.water, STREAM_END_WATER, clamp(st.s, 0, 1)));
    const pt = 1 - smoothstep(0.22, 0.42, pathDist(x, z) + 0.08 * fbm(x * 3, 0, z * 3, 2));
    if (pt > 0) c.lerp(cPath, pt * 0.85 * (1 - rockT));
    c.lerp(cSoil, smoothstep(0.95, 1.0, rn) * 0.3);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const top = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }));
  top.castShadow = top.receiveShadow = true;
  island.add(top);
}
{
  const pos = [], col = [], idx = [];
  const cA = new THREE.Color(0xa7855f), cB = new THREE.Color(0x7c5f48), cC = new THREE.Color(0xc2a57c), cDeep = new THREE.Color(0x5d5149);
  const cSoilD = new THREE.Color(0x5a3f2c), cMoss = new THREE.Color(0x5f8f3a), cEdge = new THREE.Color(0x679f3d);
  const c = new THREE.Color();
  for (let k = 0; k <= NB; k++) {
    const t = Math.pow(k / NB, 1.25), ring = [];
    for (let j = 0; j < NS; j++) {
      const th = j / NS * Math.PI * 2, ct = Math.cos(th), sth = Math.sin(th);
      const rim = ringTop[j];
      let x, y, z;
      if (k === 0) { x = rim.x; y = rim.y; z = rim.z; }
      else {
        const n = vnoise(ct * 2.2 + 5, t * 3.2, sth * 2.2 + 5), n2 = vnoise(ct * 5 + 1, t * 7, sth * 5 + 1);
        let prof = Math.pow(1 - t, 1.25) * (1 + 0.35 * t) * (1 + 0.28 * (n - 0.5) + 0.12 * (n2 - 0.5));
        if (k === 1) prof = 1.035 - 0.04 * notchAt(th);
        const R = rimR(th) * prof;
        x = ct * R; z = sth * R;
        y = lerp(rim.y, -10.8, t) - (k === 1 ? 0.12 : 0) + (n2 - 0.5) * 0.8 * t;
        const sp = Math.max(0, vnoise(ct * 3.1 + 11, 0.5, sth * 3.1 + 11) - 0.4);
        y -= 6.0 * sp * sp * t * t;   // stalactite drips
      }
      pos.push(x, y, z); ring.push(new THREE.Vector3(x, y, z));
      if (k === 0) c.copy(cEdge);
      else if (k === 1) c.copy(cSoilD);
      else {
        const s = Math.sin(y * 2.4 + fbm(ct * 1.5, y * 0.25, sth * 1.5, 3) * 4.0);
        c.copy(cA).lerp(cB, s * 0.5 + 0.5);
        c.lerp(cC, smoothstep(0.62, 0.85, vnoise(ct * 4, y * 1.3, sth * 4)) * 0.6);
        c.lerp(cDeep, smoothstep(0.3, 1.0, t) * 0.55);
        if (t < 0.25) c.lerp(cMoss, smoothstep(0.55, 0.75, vnoise(ct * 6 + 3, y * 2, sth * 6)) * (1 - t / 0.25) * 0.8);
      }
      col.push(c.r, c.g, c.b);
    }
    underRings.push(ring);
  }
  const tip = pos.length / 3;
  pos.push(0.2, -12.4, -0.1); col.push(cDeep.r, cDeep.g, cDeep.b);
  const id = (k, j) => k * NS + ((j % NS) + NS) % NS;
  for (let k = 0; k < NB; k++) for (let j = 0; j < NS; j++) {
    const u0 = id(k, j), u1 = id(k, j + 1), l0 = id(k + 1, j), l1 = id(k + 1, j + 1);
    idx.push(u0, l1, l0, u0, u1, l1);
  }
  for (let j = 0; j < NS; j++) idx.push(id(NB, j), id(NB, j + 1), tip);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const under = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
  under.castShadow = under.receiveShadow = true;
  island.add(under);

  // hanging vines & roots
  const vineMat = new THREE.MeshStandardMaterial({ color: 0x4f8034, roughness: 0.9, flatShading: true });
  const rootMat = new THREE.MeshStandardMaterial({ color: 0x5b4130, roughness: 0.95, flatShading: true });
  const leafGeo = new THREE.IcosahedronGeometry(0.075, 0);
  for (let v = 0; v < 26; v++) {
    const j = Math.floor(rand() * NS), th = j / NS * Math.PI * 2;
    if (Math.abs(wrapAng(th - TH_S)) < 0.3) continue;

  if (T > nextPondDrop) { const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * POND.r * 0.8; addDrop(pondMat, Math.cos(a) * r, Math.sin(a) * r); nextPondDrop = T + rr(0.5, 1.5); }

  for (const e of emitters) { e.acc += e.rate * dt; while (e.acc >= 1) { e.fn(); e.acc -= 1; } }
  drops.update(dt); mist.update(dt);

  controls.update();
  renderer.render(scene, camera);
});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Goldfish Aquarium Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #162a3d 0%, #0d1a27 58%, #070e17 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // 1. RENDERER & SOFTWARE-WEBGL GUARD
    // =========================================================================
    const isSoftwareGl = (() => {
      try {
        const probe = document.createElement('canvas').getContext('webgl2');
        if (!probe) return true;
        const ext = probe.getExtension('WEBGL_debug_renderer_info');
        const param = ext ? ext.UNMASKED_RENDERER_WEBGL : probe.RENDERER;
        const gpu = String(probe.getParameter(param) || '');
        probe.getExtension('WEBGL_lose_context')?.loseContext();
        return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
      } catch {
        return false;
      }
    })();

    const renderer = new THREE.WebGLRenderer({
      antialias: !isSoftwareGl,
      alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.shadowMap.enabled = !isSoftwareGl;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // =========================================================================
    // 2. SCENE, CAMERA, CONTROLS & STUDIO ENVIRONMENT
    // =========================================================================
    const scene = new THREE.Scene();

    // Subtle seamless studio backdrop gradient
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 512;
    bgCanvas.height = 512;
    const bgCtx = bgCanvas.getContext('2d');
    const bgGrad = bgCtx.createLinearGradient(0, 0, 0, 512);
    bgGrad.addColorStop(0.0, '#09131e');
    bgGrad.addColorStop(0.38, '#132638');
    bgGrad.addColorStop(0.62, '#173044');
    bgGrad.addColorStop(1.0, '#070e17');
    bgCtx.fillStyle = bgGrad;
    bgCtx.fillRect(0, 0, 512, 512);
    const bgTex = new THREE.CanvasTexture(bgCanvas);
    bgTex.colorSpace = THREE.SRGBColorSpace;
    scene.background = bgTex;

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.72;
    pmrem.dispose();

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(6.1, 3.7, 6.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, -0.14, 0);
    controls.enablePan = false;
    controls.enableDamping = !isSoftwareGl;
    controls.dampingFactor = 0.055;
    controls.minDistance = 3.8;
    controls.maxDistance = 15.0;
    controls.minPolarAngle = 0.08;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.85;
    controls.update();

    // =========================================================================
    // 3. LIGHTING RIG (SUNLIT OVERHEAD AQUARIUM LED + STUDIO FILL)
    // =========================================================================
    const hemiLight = new THREE.HemisphereLight(0xcbeeff, 0x102530, 0.68);
    scene.add(hemiLight);

    // Primary overhead aquarium light casting soft shadows onto sand
    const keyLight = new THREE.DirectionalLight(0xfff4de, 1.72);
    keyLight.position.set(2.4, 7.6, 1.8);
    keyLight.castShadow = !isSoftwareGl;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 1.0;
    keyLight.shadow.camera.far = 16.0;
    keyLight.shadow.camera.left = -3.2;
    keyLight.shadow.camera.right = 3.2;
    keyLight.shadow.camera.top = 3.2;
    keyLight.shadow.camera.bottom = -3.2;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.normalBias = 0.02;
    scene.add(keyLight);

    // Cool aquatic rim / backlight to illuminate translucent fish fins & glass edges
    const rimLight = new THREE.DirectionalLight(0x7be0ff, 0.95);
    rimLight.position.set(-4.5, 2.8, -4.2);
    scene.add(rimLight);

    // Warm subtle front bounce so fish scales pop from front angles
    const fillLight = new THREE.DirectionalLight(0xffe9cf, 0.48);
    fillLight.position.set(-2.5, 1.4, 5.2);
    scene.add(fillLight);

    // Underwater subtle turquoise glow light
    const aquaPoint = new THREE.PointLight(0x3ecae0, 0.72, 8.5, 1.8);
    aquaPoint.position.set(0, 1.15, 0);
    scene.add(aquaPoint);

    // =========================================================================
    // 4. SHARED CONSTANTS & INTERACTIVE RIPPLE STATE
    // =========================================================================
    const TANK_SIZE = 4.0;
    const HALF_OUT = TANK_SIZE * 0.5;       // 2.0
    const GLASS_THICK = 0.055;
    const HALF_IN = HALF_OUT - GLASS_THICK; // 1.945
    const WATER_TOP = 1.56;                 // Water surface height inside cube
    const FLOOR_Y = -HALF_IN;               // -1.945 (inner glass bottom)
    const MAX_RIPPLES = 12;

    // vec4(x, z, startTime, strength)
    const rippleArray = Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, -100, 0));
    let rippleCursor = 0;

    const sharedUniforms = {
      uTime: { value: 0 },
      uRipples: { value: rippleArray },
      uHalfSize: { value: HALF_IN },
      uWaterTop: { value: WATER_TOP },
      uLightDir: { value: keyLight.position.clone().normalize() },
    };

    // Deterministic pseudo-random helper for organic placement
    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261124);

    // Sculpted sand height function in tank XZ space [-HALF_IN, HALF_IN]
    function sandHeightAt(x, z) {
      const backSlope = (-z + HALF_IN) * 0.095;
      const sideMound =
        0.16 * Math.exp(-((x + 1.15) ** 2 + (z + 0.95) ** 2) * 0.65) +
        0.13 * Math.exp(-((x - 1.25) ** 2 + (z + 0.85) ** 2) * 0.72);
      const ripples =
        0.032 * Math.sin(x * 2.9 + z * 1.4) +
        0.022 * Math.cos(x * 1.7 - z * 3.1) +
        0.014 * Math.sin(x * 5.2 + z * 4.3);
      return FLOOR_Y + 0.24 + backSlope + sideMound + ripples;
    }

    // =========================================================================
    // 5. SHARED GLSL CHUNKS (WAVE PHYSICS & CHROMATIC CAUSTICS)
    // =========================================================================
    const GLSL_WAVE_FN = /* glsl */ `
      uniform float uTime;
      uniform vec4 uRipples[${MAX_RIPPLES}];
      uniform float uHalfSize;

      float evalRippleRing(vec2 p, vec2 center, float age, float strength) {
        float speed = 2.05;
        float front = age * speed;
        float d = length(p - center);
        float centerSoft = smoothstep(0.0, 0.14, d + age * 0.35);
        float packet = exp(-pow((d - front) * 2.4, 2.0)) * exp(-age * 0.72) * exp(-d * 0.22);
        float w1 = sin((d - front) * 15.5) * packet * 0.082;
        float behind = smoothstep(front + 0.14, front - 0.12, d);
        float trail = behind * exp(-max(0.0, front - d) * 2.4) * exp(-age * 0.95);
        float w2 = sin(d * 18.0 - age * 14.5) * trail * 0.025;
        return (w1 + w2) * strength * centerSoft;
      }

      float waterWaveHeight(vec2 p, float t) {
        float h = 0.0;
        h += sin(p.x * 2.1 + t * 1.55 + p.y * 0.8) * 0.014;
        h += cos(p.y * 2.7 - t * 1.32 + p.x * 1.1) * 0.011;
        h += sin((p.x * 3.4 - p.y * 2.6) + t * 2.15) * 0.007;
        h += cos((p.x * 4.9 + p.y * 4.1) - t * 2.55) * 0.0045;
        h += sin((p.x * 7.2 - p.y * 5.8) + t * 3.1) * 0.0022;

        for (int i = 0; i < ${MAX_RIPPLES}; i++) {
          vec4 rp = uRipples[i];
          float age = t - rp.z;
          if (rp.w > 0.001 && age >= 0.0 && age < 6.5) {
            h += evalRippleRing(p, rp.xy, age, rp.w);
            float rStr = rp.w * 0.36;
            h += evalRippleRing(p, vec2( 2.0 * uHalfSize - rp.x, rp.y), age, rStr);
            h += evalRippleRing(p, vec2(-2.0 * uHalfSize - rp.x, rp.y), age, rStr);
            h += evalRippleRing(p, vec2(rp.x,  2.0 * uHalfSize - rp.y), age, rStr);
            h += evalRippleRing(p, vec2(rp.x, -2.0 * uHalfSize - rp.y), age, rStr);
          }
        }
        return h;
      }
    `;

    const GLSL_CAUSTICS_FN = /* glsl */ `
      uniform float uTime;
      uniform vec4 uRipples[${MAX_RIPPLES}];
      uniform float uWaterTop;

      vec2 causticHash2(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return fract(sin(p) * 43758.5453);
      }

      // Crisp cellular Voronoi ridge caustics (bright focused light filaments + dark water troughs)
      float voronoiCaustic(vec2 x, float t) {
        vec2 n = floor(x);
        vec2 f = fract(x);
        float md1 = 8.0;
        float md2 = 8.0;
        for (int j = -1; j <= 1; j++) {
          for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = causticHash2(n + g);
            o = 0.5 + 0.42 * sin(t + 6.2831 * o);
            vec2 r = g + o - f;
            float d = dot(r, r);
            if (d < md1) {
              md2 = md1;
              md1 = d;
            } else if (d < md2) {
              md2 = d;
            }
          }
        }
        float edge = sqrt(md2) - sqrt(md1);
        return pow(1.0 - smoothstep(0.0, 0.24, edge), 1.85);
      }

      float causticPattern(vec2 uv, float t) {
        float c1 = voronoiCaustic(uv * 2.15 + vec2(t * 0.12, -t * 0.08), t * 1.15);
        float c2 = voronoiCaustic(uv * 3.10 - vec2(t * 0.09, t * 0.13) + 3.7, t * 1.35 + 1.5);
        return clamp(c1 * 0.72 + c2 * 0.55 + c1 * c2 * 0.85, 0.0, 1.8);
      }

      vec3 computeCaustics(vec3 worldPos, vec3 worldNormal) {
        float depth = max(0.0, uWaterTop - worldPos.y);
        vec2 uv = (worldPos.xz + vec2(0.14, 0.10) * depth) * 0.78;

        float rippleGlow = 0.0;
        vec2 rippleWarp = vec2(0.0);
        for (int i = 0; i < ${MAX_RIPPLES}; i++) {
          vec4 rp = uRipples[i];
          float age = uTime - rp.z;
          if (rp.w > 0.001 && age >= 0.0 && age < 6.0) {
            vec2 diff = worldPos.xz - rp.xy;
            float d = length(diff);
            float front = age * 2.05;
            float env = exp(-pow((d - front) * 2.3, 2.0)) * exp(-age * 0.68);
            float wave = sin((d - front) * 15.5);
            rippleGlow += max(0.0, wave) * env * rp.w * 1.25;
            if (d > 0.001) {
              rippleWarp += (diff / d) * wave * env * rp.w * 0.14;
            }
          }
        }

        uv += rippleWarp;
        float t = uTime * 0.85;
        float disp = 0.032;
        float cR = causticPattern(uv + vec2(disp, 0.0), t);
        float cG = causticPattern(uv, t + 0.04);
        float cB = causticPattern(uv - vec2(disp, disp * 0.6), t + 0.08);

        vec3 caust = vec3(cR, cG, cB);
        float upMask = smoothstep(0.05, 0.65, worldNormal.y);
        float depthFade = exp(-depth * 0.10);
        float wallEdge = smoothstep(1.98, 1.65, max(abs(worldPos.x), abs(worldPos.z)));
        vec3 tinted = caust * vec3(0.76, 1.02, 1.12) + vec3(0.58, 0.96, 1.05) * rippleGlow;
        return tinted * upMask * depthFade * (0.55 + 0.45 * wallEdge);
      }
    `;

    function applyCausticsToMaterial(material, intensity = 0.58, shadowTrough = 0.0) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uRipples = sharedUniforms.uRipples;
        shader.uniforms.uWaterTop = sharedUniforms.uWaterTop;
        shader.uniforms.uCausticStrength = { value: intensity };
        shader.uniforms.uShadowTrough = { value: shadowTrough };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
             varying vec3 vCausticWorldPos;
             varying vec3 vCausticWorldNormal;`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
             vCausticWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
             vCausticWorldNormal = normalize(mat3(modelMatrix) * objectNormal);`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
             uniform float uCausticStrength;
             uniform float uShadowTrough;
             varying vec3 vCausticWorldPos;
             varying vec3 vCausticWorldNormal;
             ${GLSL_CAUSTICS_FN}`
          )
          .replace(
            '#include <opaque_fragment>',
            `vec3 cLight = computeCaustics(vCausticWorldPos, normalize(vCausticWorldNormal));
             // Subtle underwater teal absorption in caustic troughs so bright caustic filaments pop crisply
             outgoingLight *= mix(vec3(1.0), vec3(0.76, 0.86, 0.92), uShadowTrough);
             outgoingLight += cLight * diffuseColor.rgb * uCausticStrength + cLight * 0.16 * uCausticStrength;
             #include <opaque_fragment>`
          );
      };
      material.needsUpdate = true;
    }

    // =========================================================================
    // 6. PROCEDURAL TEXTURES (SAND, ROCK, GOLDFISH SCALES & VEIL FINS)
    // =========================================================================
    function createSandTextures() {
      const size = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = size;
      colorCanvas.height = size;
      const cCtx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');

      cCtx.fillStyle = '#a89068';
      cCtx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      const sRand = mulberry32(9911);
      for (let i = 0; i < 160; i++) {
        const x = sRand() * size;
        const y = sRand() * size;
        const r = 18 + sRand() * 44;
        const g = cCtx.createRadialGradient(x, y, 0, x, y, r);
        const warm = sRand() > 0.5 ? 'rgba(196, 172, 132, 0.22)' : 'rgba(132, 110, 78, 0.20)';
        g.addColorStop(0, warm);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        cCtx.fillStyle = g;
        cCtx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      for (let i = 0; i < 28000; i++) {
        const x = sRand() * size;
        const y = sRand() * size;
        const s = 0.8 + sRand() * 1.9;
        const v = sRand();
        if (v < 0.16) cCtx.fillStyle = 'rgba(98, 82, 60, 0.68)';
        else if (v < 0.34) cCtx.fillStyle = 'rgba(222, 206, 174, 0.68)';
        else if (v < 0.65) cCtx.fillStyle = 'rgba(176, 152, 114, 0.68)';
        else cCtx.fillStyle = 'rgba(154, 132, 98, 0.62)';
        cCtx.fillRect(x, y, s, s);

        const bv = Math.floor(85 + sRand() * 155);
        bCtx.fillStyle = `rgb(${bv},${bv},${bv})`;
        bCtx.fillRect(x, y, s, s);
      }

      const map = new THREE.CanvasTexture(colorCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(3, 3);
      map.anisotropy = maxAnisotropy;

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(3, 3);
      bumpMap.anisotropy = maxAnisotropy;

      return { map, bumpMap };
    }

    function createRockTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#4e585f';
      ctx.fillRect(0, 0, size, size);

      const rRand = mulberry32(4412);
      for (let i = 0; i < 320; i++) {
        const x = rRand() * size;
        const y = rRand() * size;
        const rx = 6 + rRand() * 26;
        const ry = 4 + rRand() * 16;
        const l = 52 + Math.floor(rRand() * 58);
        ctx.fillStyle = `rgba(${l}, ${l + 6}, ${l + 10}, 0.28)`;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, rRand() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 1800; i++) {
        const x = rRand() * size;
        const y = rRand() * size;
        ctx.fillStyle = rRand() > 0.86 ? 'rgba(65, 98, 62, 0.32)' : 'rgba(30, 36, 42, 0.28)';
        ctx.fillRect(x, y, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    function createGoldfishBodyTextures(variety) {
      const w = 512;
      const h = 256;
      const cCanvas = document.createElement('canvas');
      cCanvas.width = w;
      cCanvas.height = h;
      const ctx = cCanvas.getContext('2d');

      const bCanvas = document.createElement('canvas');
      bCanvas.width = w;
      bCanvas.height = h;
      const bCtx = bCanvas.getContext('2d');
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, w, h);

      const baseGrad = ctx.createLinearGradient(0, 0, 0, h);
      if (variety === 'vermilion') {
        baseGrad.addColorStop(0.0, '#ffe2b0');
        baseGrad.addColorStop(0.18, '#ff7720');
        baseGrad.addColorStop(0.42, '#e62d06');
        baseGrad.addColorStop(0.5, '#c81c04');
        baseGrad.addColorStop(0.58, '#e62d06');
        baseGrad.addColorStop(0.82, '#ff7720');
        baseGrad.addColorStop(1.0, '#ffe2b0');
      } else if (variety === 'calico') {
        baseGrad.addColorStop(0.0, '#fcf8f0');
        baseGrad.addColorStop(0.5, '#f2ebe0');
        baseGrad.addColorStop(1.0, '#fcf8f0');
      } else {
        baseGrad.addColorStop(0.0, '#ffefb0');
        baseGrad.addColorStop(0.20, '#ffbb1f');
        baseGrad.addColorStop(0.5, '#df7800');
        baseGrad.addColorStop(0.80, '#ffbb1f');
        baseGrad.addColorStop(1.0, '#ffefb0');
      }
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, w, h);

      if (variety === 'calico') {
        // Bold iconic Sarasa Red-and-White markings wrapping forehead crown, shoulders, and flanks
        const patches = [
          { x: 76,  y: 128, rx: 72,  ry: 88,  color: '#e02006' },
          { x: 165, y: 74,  rx: 82,  ry: 58,  color: '#e82908' },
          { x: 165, y: 182, rx: 82,  ry: 58,  color: '#e82908' },
          { x: 315, y: 128, rx: 112, ry: 112, color: '#df2206' },
          { x: 435, y: 128, rx: 70,  ry: 95,  color: '#d81e06' },
        ];
        for (const p of patches) {
          const g = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, Math.max(p.rx, p.ry));
          g.addColorStop(0.0, p.color);
          g.addColorStop(0.78, p.color);
          g.addColorStop(1.0, 'rgba(224, 32, 6, 0)');
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(1, p.ry / p.rx);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, p.rx, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        const inks = [
          { x: 225, y: 68,  r: 18 },
          { x: 225, y: 188, r: 18 },
          { x: 365, y: 92,  r: 20 },
        ];
        for (const k of inks) {
          const g = ctx.createRadialGradient(k.x, k.y, 2, k.x, k.y, k.r);
          g.addColorStop(0, 'rgba(22, 26, 36, 0.85)');
          g.addColorStop(0.7, 'rgba(22, 26, 36, 0.52)');
          g.addColorStop(1, 'rgba(22, 26, 36, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (variety === 'vermilion') {
        const g = ctx.createRadialGradient(210, 128, 12, 210, 128, 150);
        g.addColorStop(0, 'rgba(255, 196, 66, 0.28)');
        g.addColorStop(1, 'rgba(255, 196, 66, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }

      const cols = 28;
      const rows = 18;
      const cellW = (w * 0.80) / cols;
      const cellH = h / rows;

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r <= rows; r++) {
          const cx = w * 0.20 + c * cellW;
          const cy = (r + (c % 2) * 0.5) * cellH;
          const rad = cellW * 0.68;

          ctx.strokeStyle =
            variety === 'calico'
              ? 'rgba(255, 255, 255, 0.22)'
              : 'rgba(255, 232, 175, 0.25)';
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.arc(cx, cy, rad, -Math.PI * 0.46, Math.PI * 0.46);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(85, 22, 5, 0.14)';
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          ctx.arc(cx + 1.2, cy, rad, -Math.PI * 0.44, Math.PI * 0.44);
          ctx.stroke();

          const bg = bCtx.createRadialGradient(cx - rad * 0.2, cy, 1, cx, cy, rad);
          bg.addColorStop(0, '#c8c8c8');
          bg.addColorStop(0.75, '#969696');
          bg.addColorStop(1, '#4c4c4c');
          bCtx.fillStyle = bg;
          bCtx.beginPath();
          bCtx.arc(cx, cy, rad, -Math.PI * 0.5, Math.PI * 0.5);
          bCtx.fill();
        }
      }

      ctx.strokeStyle = 'rgba(95, 25, 10, 0.28)';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.arc(w * 0.17, h * 0.30, 32, -0.8, 0.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w * 0.17, h * 0.70, 32, -0.9, 0.8);
      ctx.stroke();

      const map = new THREE.CanvasTexture(cCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = maxAnisotropy;

      const bumpMap = new THREE.CanvasTexture(bCanvas);
      bumpMap.anisotropy = maxAnisotropy;

      return { map, bumpMap };
    }

    function createFinTexture(variety) {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      const grad = ctx.createLinearGradient(0, 0, size, 0);
      if (variety === 'vermilion') {
        grad.addColorStop(0.0, 'rgba(248, 86, 20, 0.92)');
        grad.addColorStop(0.32, 'rgba(255, 138, 62, 0.76)');
        grad.addColorStop(0.70, 'rgba(255, 212, 168, 0.48)');
        grad.addColorStop(1.0, 'rgba(255, 245, 232, 0.18)');
      } else if (variety === 'calico') {
        grad.addColorStop(0.0, 'rgba(255, 245, 236, 0.86)');
        grad.addColorStop(0.28, 'rgba(252, 128, 92, 0.56)');
        grad.addColorStop(0.68, 'rgba(255, 252, 248, 0.44)');
        grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.14)');
      } else {
        grad.addColorStop(0.0, 'rgba(245, 162, 22, 0.90)');
        grad.addColorStop(0.36, 'rgba(255, 214, 96, 0.72)');
        grad.addColorStop(0.75, 'rgba(255, 242, 185, 0.44)');
        grad.addColorStop(1.0, 'rgba(255, 252, 230, 0.16)');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 36; i++) {
        const y0 = (i / 35) * size;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
        ctx.lineWidth = i % 3 === 0 ? 1.6 : 0.9;
        ctx.beginPath();
        ctx.moveTo(0, y0);
        ctx.lineTo(size, y0 + Math.sin(i * 0.4) * 4);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

      vertexShader: /* glsl */ `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        varying vec3 vWorldPos;
        ${GLSL_CAUSTICS_FN}
        void main() {
          vec2 p = vWorldPos.xz;
          float boxDist = max(abs(p.x), abs(p.y)) - 2.02;
          float underShadow = smoothstep(1.35, -0.15, boxDist) * 0.56;
          float edgeAO = exp(-abs(boxDist) * 6.5) * 0.32;

          float haloRing = smoothstep(-0.05, 0.18, boxDist) * exp(-max(0.0, boxDist) * 1.15);
          vec3 caust = computeCaustics(vec3(p.x * 0.85, -1.9, p.y * 0.85), vec3(0.0, 1.0, 0.0));
          vec3 spill = caust * vec3(0.32, 0.80, 0.92) * haloRing * 0.24;

          float radialFade = smoothstep(11.5, 2.5, length(p));
          vec3 col = mix(vec3(0.02, 0.05, 0.08), spill + vec3(0.05, 0.11, 0.16), haloRing);
          float alpha = clamp(underShadow + edgeAO + length(spill) * 0.65, 0.0, 0.82) * radialFade;
          gl_FragColor = vec4(col, alpha);
        }
      `,
    });

    function createSandSideWall(axis, sign) {

          const d = a + 3;
          if ((axis === 'z' && sign > 0) || (axis === 'x' && sign < 0)) {
            indices.push(a, c, b, b, c, d);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      const rr = mulberry32(cfg.seed * 73);
      const phaseA = rr() * 6.28;
      const phaseB = rr() * 6.28;
      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);
        const n =
          1.0 +
          0.12 * Math.sin(vx * 2.8 + phaseA) * Math.cos(vz * 2.5 + phaseB) +
          0.07 * Math.sin(vy * 3.8 + vx * 2.2);
        vx *= cfg.sx * n;
        vy *= cfg.sy * n;
        vz *= cfg.sz * n;

        pos.setXYZ(i, vx, vy, vz);

      });
    }

    function createDriftwood() {
      const woodGroup = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({
        color: 0x5c4230,
        roughness: 0.78,
        metalness: 0.04,
      });
      applyCausticsToMaterial(woodMat, 0.45);

      function addBranch(points, rStart, rEnd) {
        const curve = new THREE.CatmullRomCurve3(points);
        const segs = 28;
        const radSegs = 10;
        const geo = new THREE.TubeGeometry(curve, segs, 1.0, radSegs, false);
        const pos = geo.attributes.position;
        const tmp = new THREE.Vector3();
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const center = curve.getPointAt(t);
          const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.85));
          for (let j = 0; j <= radSegs; j++) {
            const idx = i * (radSegs + 1) + j;
            tmp.fromBufferAttribute(pos, idx).sub(center);
            const gnarl = 1.0 + 0.12 * Math.sin(t * 18.0 + j * 2.1);
            tmp.multiplyScalar(radius * gnarl).add(center);
            pos.setXYZ(idx, tmp.x, tmp.y, tmp.z);
          }
        }
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, woodMat);
        mesh.castShadow = !isSoftwareGl;
        mesh.receiveShadow = true;
        woodGroup.add(mesh);
      }

      const baseY = sandHeightAt(-1.05, -0.78);
      addBranch(
        [
          new THREE.Vector3(-1.18, baseY - 0.04, -0.85),
          new THREE.Vector3(-0.72, baseY + 0.28, -0.58),
          new THREE.Vector3(-0.18, baseY + 0.62, -0.35),
          new THREE.Vector3(0.32, baseY + 0.92, -0.22),
          new THREE.Vector3(0.62, baseY + 1.12, -0.14),

        0.13,
        0.025

      addBranch(

          new THREE.Vector3(-0.48, baseY + 0.42, -0.48),
          new THREE.Vector3(-0.12, baseY + 0.68, -0.68),
          new THREE.Vector3(0.24, baseY + 0.98, -0.78),
        ],
        0.072,
        0.018
      );
      addBranch(
        [
          new THREE.Vector3(-0.82, baseY + 0.22, -0.64),
          new THREE.Vector3(-0.98, baseY + 0.56, -0.24),
          new THREE.Vector3(-0.88, baseY + 0.88, 0.04),

        0.065,

    // =========================================================================
    // 9. SWAYING PROCEDURAL AQUATIC PLANTS (3 SPECIES, GPU VERTEX SWAY)
    // =========================================================================
    function createPlantMaterial(baseColorHex, tipColorHex, phaseOffset) {
      const mat = new THREE.MeshStandardMaterial({
        color: baseColorHex,
        roughness: 0.42,
        metalness: 0.02,
        side: THREE.DoubleSide,
      });
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uRipples = sharedUniforms.uRipples;
        shader.uniforms.uWaterTop = sharedUniforms.uWaterTop;
        shader.uniforms.uTipColor = { value: new THREE.Color(tipColorHex) };
        shader.uniforms.uPhase = { value: phaseOffset };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
             uniform float uTime;
             uniform float uPhase;
             attribute float aSwayWeight;
             varying float vLeafH;
             varying vec3 vCausticWorldPos;
             varying vec3 vCausticWorldNormal;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             vLeafH = aSwayWeight;
             float w = pow(clamp(aSwayWeight, 0.0, 1.0), 1.55);
             vec4 wpPre = modelMatrix * vec4(transformed, 1.0);
             float t = uTime * 1.25 + uPhase;
             float swayX = sin(t + wpPre.x * 1.4 + wpPre.y * 1.6) * 0.16
                         + sin(t * 1.9 + wpPre.z * 2.1) * 0.05;
             float swayZ = cos(t * 0.88 + wpPre.z * 1.3 + wpPre.y * 1.4) * 0.12
                         + cos(t * 1.7 - wpPre.x * 1.8) * 0.04;
             transformed.x += swayX * w;
             transformed.z += swayZ * w;
             transformed.y -= (swayX * swayX + swayZ * swayZ) * 0.18 * w;`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
             vCausticWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
             vCausticWorldNormal = normalize(mat3(modelMatrix) * objectNormal);`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
             uniform vec3 uTipColor;
             varying float vLeafH;
             varying vec3 vCausticWorldPos;
             varying vec3 vCausticWorldNormal;
             ${GLSL_CAUSTICS_FN}`
          )
          .replace(
            '#include <color_fragment>',
            `#include <color_fragment>
             diffuseColor.rgb = mix(diffuseColor.rgb, uTipColor, smoothstep(0.15, 0.95, vLeafH));`
          )
          .replace(
            '#include <opaque_fragment>',
            `vec3 cLight = computeCaustics(vCausticWorldPos, vec3(0.0, 1.0, 0.0));
             outgoingLight += diffuseColor.rgb * (0.14 * vLeafH + cLight * 0.24);
             #include <opaque_fragment>`
          );
      };
      return mat;
    }

    function buildVallisneriaBlade(height, maxWidth, archX, archZ) {
      const segY = 18;
      const positions = [];
      const uvs = [];
      const swayWeights = [];
      const indices = [];

      for (let i = 0; i <= segY; i++) {
        const t = i / segY;
        const y = t * height;
        const width = maxWidth * (0.55 + 0.45 * Math.sin(t * Math.PI * 0.88)) * (1.0 - Math.pow(t, 4.0) * 0.92);
        const curveX = archX * t * t;
        const curveZ = archZ * t * t;
        const twist = t * 0.85;
        const cosT = Math.cos(twist);
        const sinT = Math.sin(twist);

        for (let side = -1; side <= 1; side += 2) {
          const halfW = width * 0.5 * side;
          positions.push(curveX + halfW * cosT, y, curveZ + halfW * sinT);
          uvs.push(side < 0 ? 0 : 1, t);
          swayWeights.push(t);
        }

        if (i < segY) {
          const a = i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          indices.push(a, b, c, b, d, c);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('aSwayWeight', new THREE.Float32BufferAttribute(swayWeights, 1));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function buildLeafyStem(height, tiers) {
      const positions = [];
      const uvs = [];
      const swayWeights = [];
      const indices = [];
      let vOffset = 0;

      const stemSegs = 12;
      const stemRad = 0.014;
      for (let i = 0; i <= stemSegs; i++) {
        const t = i / stemSegs;
        const y = t * height;
        const cx = Math.sin(t * 2.2) * 0.04;
        const cz = Math.cos(t * 1.8) * 0.03;
        for (let k = 0; k < 4; k++) {
          const a = (k / 4) * Math.PI * 2;
          positions.push(cx + Math.cos(a) * stemRad, y, cz + Math.sin(a) * stemRad);
          uvs.push(k / 4, t);
          swayWeights.push(t);
        }
        if (i < stemSegs) {
          for (let k = 0; k < 4; k++) {
            const kNext = (k + 1) % 4;
            const a = vOffset + i * 4 + k;
            const b = vOffset + i * 4 + kNext;
            const c = vOffset + (i + 1) * 4 + k;
            const d = vOffset + (i + 1) * 4 + kNext;
            indices.push(a, b, c, b, d, c);
          }
        }
      }
      vOffset += (stemSegs + 1) * 4;

      for (let tier = 1; tier <= tiers; tier++) {
        const t = tier / (tiers + 0.5);
        const yBase = t * height;
        const cx = Math.sin(t * 2.2) * 0.04;
        const cz = Math.cos(t * 1.8) * 0.03;
        const leafCount = 3;
        const leafLen = (0.14 + 0.08 * Math.sin(t * Math.PI)) * (1.0 - t * 0.25);
        const leafWid = leafLen * 0.44;

        for (let l = 0; l < leafCount; l++) {
          const ang = (tier * 1.18) + (l * Math.PI * 2) / leafCount;
          const dx = Math.cos(ang);
          const dz = Math.sin(ang);
          const px = -dz;
          const pz = dx;
          const pitch = 0.35 + (1.0 - t) * 0.2;

          const pts = [
            [0, 0, 0],
            [leafLen * 0.42, leafLen * 0.14 * pitch, -leafWid * 0.5],
            [leafLen * 0.42, leafLen * 0.14 * pitch,  leafWid * 0.5],
            [leafLen * 0.80, leafLen * 0.16 * pitch, -leafWid * 0.28],
            [leafLen * 0.80, leafLen * 0.16 * pitch,  leafWid * 0.28],
            [leafLen,        leafLen * 0.08 * pitch,  0],
          ];
          for (const [f, up, side] of pts) {
            positions.push(cx + dx * f + px * side, yBase + up, cz + dz * f + pz * side);
            uvs.push(f / leafLen, 0.5 + side / (leafWid + 0.001));
            swayWeights.push(Math.min(1.0, t + (f / height) * 0.35));
          }
          indices.push(
            vOffset + 0, vOffset + 1, vOffset + 2,
            vOffset + 1, vOffset + 3, vOffset + 2,
            vOffset + 2, vOffset + 3, vOffset + 4,
            vOffset + 3, vOffset + 5, vOffset + 4
          );
          vOffset += 6;
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('aSwayWeight', new THREE.Float32BufferAttribute(swayWeights, 1));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function buildBroadLeaf(length, width, arch) {
      const segs = 10;
      const positions = [];
      const uvs = [];
      const swayWeights = [];
      const indices = [];

      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const forward = t * length;
        const y = Math.sin(t * Math.PI * 0.72) * arch + t * length * 0.38;
        const w = width * Math.sin(Math.pow(t, 0.75) * Math.PI);
        const cup = w * 0.12;
        positions.push(-w * 0.5, y + cup, forward);
        uvs.push(0, t);
        swayWeights.push(t * 0.65);

        positions.push(0, y, forward);
        uvs.push(0.5, t);
        swayWeights.push(t * 0.65);

        positions.push(w * 0.5, y + cup, forward);
        uvs.push(1, t);
        swayWeights.push(t * 0.65);

        if (i < segs) {
          const r0 = i * 3;
          const r1 = (i + 1) * 3;
          indices.push(r0, r0 + 1, r1, r0 + 1, r1 + 1, r1);
          indices.push(r0 + 1, r0 + 2, r1 + 1, r0 + 2, r1 + 2, r1 + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('aSwayWeight', new THREE.Float32BufferAttribute(swayWeights, 1));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createGoldfishBodyGeometry() {
      const lenSegs = 34;
      const radSegs = 26;
      const length = 0.68;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= lenSegs; i++) {
        const u = i / lenSegs;
        const z = (0.5 - u) * length;

        let dorsalY, ventralY, halfWidth;
        if (u < 0.001) {
          dorsalY = 0.0;
          ventralY = 0.0;
          halfWidth = 0.001;
        } else {
          // Smooth organic rounded Ryukin/Fantail silhouette (plump oval body, no sharp dorsal pinch)
          const frontRound = Math.pow(Math.sin(Math.min(1, u / 0.44) * Math.PI * 0.5), 0.62);
          const rearTaper = Math.pow(Math.max(0, 1.0 - Math.max(0, (u - 0.30) / 0.70)), 1.25);
          const env = frontRound * (0.18 + 0.82 * rearTaper);

          const dorsalArch = 0.038 * Math.exp(-Math.pow((u - 0.44) / 0.28, 2.0));
          dorsalY = 0.168 * env + dorsalArch;
          const bellyRound = 0.056 * Math.exp(-Math.pow((u - 0.40) / 0.28, 2.0));
          ventralY = -(0.142 * env + bellyRound);
          halfWidth = (0.138 * env + 0.018 * Math.exp(-Math.pow((u - 0.36) / 0.26, 2.0))) * (1.0 - 0.25 * Math.pow(u, 2.2));
        }

        const mouthLift = 0.014 * Math.exp(-Math.pow(u / 0.08, 2.0));

        for (let j = 0; j <= radSegs; j++) {
          const v = j / radSegs;
          const theta = (v - 0.5) * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          const y = (cosT >= 0 ? cosT * dorsalY : -cosT * ventralY) + mouthLift;
          const keel = 1.0 - 0.12 * Math.pow(Math.abs(cosT), 3.0);
          const x = sinT * halfWidth * keel;

          positions.push(x, y, z);
          uvs.push(u, v);
        }

        if (i < lenSegs) {
          for (let j = 0; j < radSegs; j++) {
            const a = i * (radSegs + 1) + j;
            const b = a + 1;
            const c = a + (radSegs + 1);
            const d = c + 1;
            indices.push(a, c, b, b, c, d);
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createVeilTailGeometry() {
      const segU = 22;
      const segV = 16;
      const positions = [];
      const uvs = [];
      const indices = [];
      let vOff = 0;

      for (const side of [-1, 1]) {
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          for (let j = 0; j <= segV; j++) {
            const v = j / segV;
            const vCentered = v * 2 - 1;

            const forkNotch = 1.0 - 0.34 * Math.exp(-Math.pow(vCentered / 0.32, 2.0));
            const length = (0.48 + 0.08 * Math.abs(vCentered)) * forkNotch;
            const z = -0.315 - u * length;

            const spreadY = 0.052 + Math.pow(u, 0.78) * 0.275;
            const y = vCentered * spreadY + Math.pow(u, 1.8) * 0.025 * (vCentered > 0 ? 1 : -0.8);

            const flareX = side * (0.008 + Math.pow(u, 0.9) * 0.105 * (0.55 + 0.45 * (1.0 - v)));
            const drapeX = Math.sin(v * Math.PI * 2.5) * 0.012 * u;

            positions.push(flareX + drapeX, y, z);
            uvs.push(u, v);
          }

          if (i < segU) {
            for (let j = 0; j < segV; j++) {
              const a = vOff + i * (segV + 1) + j;
              const b = a + 1;
              const c = a + (segV + 1);
              const d = c + 1;
              indices.push(a, b, c, b, d, c);
            }
          }
        }
        vOff += (segU + 1) * (segV + 1);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createDorsalFinGeometry() {
      const segU = 18;
      const segV = 14;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segU; i++) {
        const u = i / segU;
        for (let j = 0; j <= segV; j++) {
          const v = j / segV;
          const zBase = THREE.MathUtils.lerp(0.11, -0.22, v);
          // Embed dorsal root slightly inside upper back ridge so it joins body seamlessly
          const yBase = 0.172 * Math.sin(THREE.MathUtils.lerp(0.30, 0.86, v) * Math.PI) - 0.015;

          const sailH = 0.205 * Math.sin(Math.pow(v, 0.62) * Math.PI * 0.94) + 0.045 * v;
          const y = yBase + u * sailH;
          const z = zBase - u * (0.12 + 0.11 * v);
          const x = Math.sin(v * Math.PI * 1.5) * 0.012 * u;

          positions.push(x, y, z);
          uvs.push(u, v);
        }

        if (i < segU) {
          for (let j = 0; j < segV; j++) {
            const a = i * (segV + 1) + j;
            const b = a + 1;
            const c = a + (segV + 1);
            const d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createLowerFinGeometry(length, height, zRoot, yRoot, spreadX = 0) {
      const segU = 10;
      const segV = 8;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segU; i++) {
        const u = i / segU;
        for (let j = 0; j <= segV; j++) {
          const v = j / segV;
          const z = zRoot - v * length * 0.65 - u * length * 0.65;
          const y = yRoot - u * height * (0.72 + 0.28 * Math.sin(v * Math.PI));
          const x = spreadX * (0.25 + 0.75 * u);
          positions.push(x, y, z);
          uvs.push(u, v);
        }
        if (i < segU) {
          for (let j = 0; j < segV; j++) {
            const a = i * (segV + 1) + j;
            const b = a + 1;
            const c = a + (segV + 1);
            const d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }
      }

      const geo = new THREE.BufferGeometry();

      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createPectoralFinGeometry(side) {
      const segU = 10;
      const segV = 8;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segU; i++) {
        const u = i / segU;
        for (let j = 0; j <= segV; j++) {
          const v = j / segV;
          const fan = (v - 0.5) * (0.04 + 0.14 * Math.pow(u, 0.7));
          const x = side * (u * 0.165 * Math.sin(0.55 + v * 0.75));
          const y = -u * 0.075 + fan * 0.32;
          const z = -u * 0.155 - v * 0.08 * u;
          positions.push(x, y, z);
          uvs.push(u, v);
        }
        if (i < segU) {
          for (let j = 0; j < segV; j++) {
            const a = i * (segV + 1) + j;
            const b = a + 1;
            const c = a + (segV + 1);
            const d = c + 1;

    function applyFishSwimShader(material, fishUniforms, isFin = false) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uSwimPhase = fishUniforms.uSwimPhase;
        shader.uniforms.uSwimAmp = fishUniforms.uSwimAmp;
        shader.uniforms.uTurnBend = fishUniforms.uTurnBend;
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uRipples = sharedUniforms.uRipples;
        shader.uniforms.uWaterTop = sharedUniforms.uWaterTop;

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
             uniform float uSwimPhase;
             uniform float uSwimAmp;
             uniform float uTurnBend;
             varying vec3 vCausticWorldPos;
             varying vec3 vCausticWorldNormal;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             float axial = clamp((0.34 - transformed.z) / 1.14, 0.0, 1.0);
             float sway = sin(uSwimPhase - axial * 5.0) * (0.010 + 0.155 * axial * axial) * uSwimAmp;
             float turnCurve = uTurnBend * (axial - 0.24) * (axial - 0.24) * 0.30;
             ${isFin ? `
             float flutter = sin(uSwimPhase * 1.0 - axial * 7.6 + transformed.y * 5.5)
                           * 0.042 * pow(max(0.0, axial - 0.45), 1.25) * uSwimAmp;
             transformed.x += sway + turnCurve + flutter;
             ` : `
             transformed.x += sway + turnCurve;
             `}`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
             vCausticWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
             vCausticWorldNormal = normalize(mat3(modelMatrix) * objectNormal);`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
             varying vec3 vCausticWorldPos;
             varying vec3 vCausticWorldNormal;
             ${GLSL_CAUSTICS_FN}`
          )
          .replace(
            '#include <opaque_fragment>',
            `vec3 cLight = computeCaustics(vCausticWorldPos, normalize(vCausticWorldNormal));
             outgoingLight += cLight * diffuseColor.rgb * ${isFin ? '0.24' : '0.36'};
             #include <opaque_fragment>`
          );
      };
      material.needsUpdate = true;
    }

    // =========================================================================
    // 11. RISING AIR BUBBLES & SUSPENDED AQUATIC MICRO-MOTES
    // =========================================================================
    const BUBBLE_COUNT = 145;

    const bubbleMat = new THREE.ShaderMaterial({
      transparent: true,

        uLightDir: sharedUniforms.uLightDir,

      vertexShader: /* glsl */ `
        varying vec3 vNormalW;
        varying vec3 vViewDir;
        void main() {
          vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);

      fragmentShader: /* glsl */ `
        uniform vec3 uLightDir;
        varying vec3 vNormalW;
        varying vec3 vViewDir;
        void main() {
          vec3 N = normalize(vNormalW);
          vec3 V = normalize(vViewDir);
          float ndv = max(dot(N, V), 0.0);
          float fresnel = pow(1.0 - ndv, 2.6);
          vec3 H = normalize(uLightDir + V);
          float spec = pow(max(dot(N, H), 0.0), 48.0);
          vec3 col = mix(vec3(0.58, 0.90, 0.98), vec3(0.96, 0.99, 1.0), fresnel) + vec3(1.0) * spec * 1.45;
          float alpha = clamp(0.14 + fresnel * 0.72 + spec * 0.95, 0.0, 0.94);
          gl_FragColor = vec4(col, alpha);
        }
      `,
    });

    const bubbleMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_COUNT);
    bubbleMesh.frustumCulled = false;
    bubbleMesh.renderOrder = 4;
    scene.add(bubbleMesh);

    const bubbles = [];
    function resetBubble(b, randomizeY = false, burstOrigin = null) {
      if (burstOrigin) {
        b.baseX = burstOrigin.x + (Math.random() - 0.5) * 0.22;
        b.baseZ = burstOrigin.z + (Math.random() - 0.5) * 0.22;
        b.y = WATER_TOP - 0.06 - Math.random() * 0.24;
        b.radius = 0.012 + Math.random() * 0.022;
        b.speed = 0.24 + Math.random() * 0.22;
        b.isBurst = true;
      } else {
        const fromDiffuser = Math.random() < 0.80;
        if (fromDiffuser) {
          b.baseX = diffuserX + (Math.random() - 0.5) * 0.20;
          b.baseZ = diffuserZ + (Math.random() - 0.5) * 0.20;
          b.y = randomizeY
            ? THREE.MathUtils.lerp(diffuserY + 0.05, WATER_TOP - 0.05, Math.random())
            : diffuserY + 0.04;
          b.radius = 0.012 + Math.pow(Math.random(), 2.2) * 0.042;
          b.speed = 0.42 + b.radius * 9.5 + Math.random() * 0.16;
        } else {
          b.baseX = (Math.random() * 2 - 1) * (HALF_IN - 0.25);
          b.baseZ = -0.35 - Math.random() * (HALF_IN - 0.6);
          const startY = sandHeightAt(b.baseX, b.baseZ) + 0.3 + Math.random() * 0.8;
          b.y = randomizeY
            ? THREE.MathUtils.lerp(startY, WATER_TOP - 0.05, Math.random())
            : startY;
          b.radius = 0.008 + Math.random() * 0.015;
          b.speed = 0.22 + Math.random() * 0.18;
        }
        b.isBurst = false;
      }
      b.phase = Math.random() * Math.PI * 2;
      b.wobbleAmp = 0.025 + Math.random() * 0.055;
      b.wobbleFreq = 2.2 + Math.random() * 2.8;
    }

    for (let i = 0; i < BUBBLE_COUNT; i++) {
      const b = { baseX: 0, baseZ: 0, y: 0, radius: 0.02, speed: 0.5, phase: 0, wobbleAmp: 0.03, wobbleFreq: 2.5, isBurst: false };
      resetBubble(b, true, null);
      bubbles.push(b);
    }

    let burstCursor = 0;
    function spawnSurfaceBubbleBurst(x, z) {
      for (let k = 0; k < 6; k++) {
        const idx = (BUBBLE_COUNT - 24) + (burstCursor % 24);
        burstCursor++;
        resetBubble(bubbles[idx], false, { x, z });
      }
    }

    const MOTE_COUNT = 120;
    const motePositions = new Float32Array(MOTE_COUNT * 3);
    const moteSeeds = new Float32Array(MOTE_COUNT);
    for (let i = 0; i < MOTE_COUNT; i++) {
      const mx = (rand() * 2 - 1) * (HALF_IN - 0.14);
      const mz = (rand() * 2 - 1) * (HALF_IN - 0.14);
      const my = THREE.MathUtils.lerp(sandHeightAt(mx, mz) + 0.15, WATER_TOP - 0.14, rand());
      motePositions[i * 3] = mx;
      motePositions[i * 3 + 1] = my;
      motePositions[i * 3 + 2] = mz;
      moteSeeds[i] = rand() * 100.0;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));
    moteGeo.setAttribute('aSeed', new THREE.BufferAttribute(moteSeeds, 1));
    const moteMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: sharedUniforms.uTime },
      vertexShader: /* glsl */ `
        uniform float uTime;
        attribute float aSeed;
        varying float vAlpha;
        void main() {
          vec3 p = position;
          p.x += sin(uTime * 0.42 + aSeed) * 0.08;
          p.y += cos(uTime * 0.35 + aSeed * 1.3) * 0.06;
          p.z += sin(uTime * 0.38 + aSeed * 0.7) * 0.08;
          vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = clamp(20.0 / -mvPos.z, 1.5, 4.2);
          vAlpha = 0.22 + 0.18 * sin(uTime * 1.4 + aSeed);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: /* glsl */ `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float soft = smoothstep(0.5, 0.05, d);
          gl_FragColor = vec4(0.75, 0.96, 1.0, soft * vAlpha);
        }
      `,
    });
    const motePoints = new THREE.Points(moteGeo, moteMat);
    motePoints.renderOrder = 3;
    scene.add(motePoints);

    // =========================================================================
    // 12. REAL-TIME RIPPLING WATER SURFACE, LIQUID VOLUME & VOLUMETRIC GOD-RAYS
    // =========================================================================
    const waterGeo = new THREE.PlaneGeometry(HALF_IN * 2 - 0.006, HALF_IN * 2 - 0.006, 96, 96);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: sharedUniforms.uTime,
        uRipples: sharedUniforms.uRipples,
        uHalfSize: sharedUniforms.uHalfSize,
        uLightDir: sharedUniforms.uLightDir,
      },
      vertexShader: /* glsl */ `
        varying vec3 vWorldPos;
        varying vec2 vLocalXZ;
        varying float vWaveH;
        ${GLSL_WAVE_FN}
        void main() {
          vec3 pos = position;
          float h = waterWaveHeight(pos.xz, uTime);
          pos.y += h;
          vLocalXZ = pos.xz;
          vWaveH = h;
          vec4 wp = modelMatrix * vec4(pos, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3 uLightDir;
        varying vec3 vWorldPos;
        varying vec2 vLocalXZ;
        varying float vWaveH;
        ${GLSL_WAVE_FN}
        void main() {
          float eps = 0.018;
          float hC = waterWaveHeight(vLocalXZ, uTime);
          float hX = waterWaveHeight(vLocalXZ + vec2(eps, 0.0), uTime);
          float hZ = waterWaveHeight(vLocalXZ + vec2(0.0, eps), uTime);
          vec3 N = normalize(vec3(hC - hX, eps, hC - hZ));
          if (!gl_FrontFacing) N = -N;

          vec3 V = normalize(cameraPosition - vWorldPos);
          float ndv = max(dot(N, V), 0.0);
          float fresnel = 0.05 + 0.95 * pow(1.0 - ndv, 3.8);

          vec3 R = reflect(-V, N);
          float softbox = smoothstep(0.55, 0.92, R.y) * smoothstep(0.85, 0.2, length(R.xz));
          vec3 envReflect = mix(vec3(0.18, 0.56, 0.68), vec3(0.82, 0.96, 1.0), clamp(R.y * 0.6 + 0.4, 0.0, 1.0));
          envReflect += vec3(0.95, 0.98, 1.0) * softbox * 0.55;

          vec3 H1 = normalize(uLightDir + V);
          float spec1 = pow(max(dot(N, H1), 0.0), 140.0);
          vec3 H2 = normalize(normalize(vec3(-0.55, 0.72, -0.42)) + V);
          float spec2 = pow(max(dot(N, H2), 0.0), 48.0);

          float wallDist = uHalfSize - max(abs(vLocalXZ.x), abs(vLocalXZ.y));
          float meniscus = smoothstep(0.075, 0.0, wallDist);

          float crest = smoothstep(0.008, 0.045, abs(hC));

          vec3 baseAqua = vec3(0.24, 0.78, 0.86);
          vec3 col = mix(baseAqua, envReflect, clamp(fresnel * 0.82 + 0.14, 0.0, 1.0));
          col += vec3(1.0, 0.99, 0.95) * (spec1 * 1.85 + spec2 * 0.32);
          col += vec3(0.75, 0.97, 1.0) * (meniscus * 0.52 + crest * 0.14);

          float alpha = clamp(0.20 + fresnel * 0.56 + spec1 * 0.85 + meniscus * 0.48 + crest * 0.15, 0.18, 0.90);
          gl_FragColor = vec4(col, alpha);
        }
      `,
    });

    const waterSurface = new THREE.Mesh(waterGeo, waterMat);
    waterSurface.position.y = WATER_TOP;
    waterSurface.renderOrder = 6;
    scene.add(waterSurface);

    function createWaterSideCurtain(axis, sign) {
      const segW = 48;
      const segH = 6;
      const span = HALF_IN * 2 - 0.008;
      const height = WATER_TOP - FLOOR_Y;
      const geo = new THREE.PlaneGeometry(span, height, segW, segH);

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide,
        uniforms: {
          uTime: sharedUniforms.uTime,
          uRipples: sharedUniforms.uRipples,
          uHalfSize: sharedUniforms.uHalfSize,
          uWaterTop: sharedUniforms.uWaterTop,
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          varying vec3 vWorldPos;
          varying vec3 vNormalW;
          ${GLSL_WAVE_FN}
          void main() {
            vUv = uv;
            vec3 pos = position;
            vec4 wp = modelMatrix * vec4(pos, 1.0);
            float waveH = waterWaveHeight(wp.xz, uTime);
            wp.y += waveH * pow(uv.y, 2.0);
            vWorldPos = wp.xyz;
            vNormalW = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          varying vec2 vUv;
          varying vec3 vWorldPos;
          varying vec3 vNormalW;
          void main() {
            vec3 V = normalize(cameraPosition - vWorldPos);
            float fres = pow(1.0 - max(dot(normalize(vNormalW), V), 0.0), 3.0);
            vec3 col = mix(vec3(0.08, 0.36, 0.46), vec3(0.32, 0.80, 0.88), vUv.y);
            float topRim = smoothstep(0.975, 1.0, vUv.y);
            col += vec3(0.72, 0.96, 1.0) * topRim * 0.75;
            float alpha = 0.08 + 0.14 * fres + topRim * 0.45;
            gl_FragColor = vec4(col, alpha);
          }
        `,
      });

      const mesh = new THREE.Mesh(geo, mat);
      const midY = (WATER_TOP + FLOOR_Y) * 0.5;
      const offset = HALF_IN - 0.004;
      if (axis === 'z') {
        mesh.position.set(0, midY, sign * offset);
        if (sign < 0) mesh.rotation.y = Math.PI;
      } else {
        mesh.position.set(sign * offset, midY, 0);
        mesh.rotation.y = sign > 0 ? Math.PI / 2 : -Math.PI / 2;
      }
      mesh.renderOrder = 5;
      scene.add(mesh);
    }

    for (const [axis, sign] of [
      ['z', 1],
      ['z', -1],
      ['x', 1],
      ['x', -1],
    ]) {
      createWaterSideCurtain(axis, sign);
    }

    const rayGroup = new THREE.Group();
    const rayMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: { uTime: sharedUniforms.uTime },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        varying vec3 vNormalW;
        varying vec3 vViewDir;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vNormalW = normalize(mat3(modelMatrix) * normal);
          vViewDir = normalize(cameraPosition - wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormalW;
        varying vec3 vViewDir;
        void main() {
          float beam = sin(vUv.x * 16.0 + uTime * 0.65) * 0.5 + 0.5;
          float beam2 = sin(vUv.x * 29.0 - uTime * 0.92 + 1.4) * 0.5 + 0.5;
          float shafts = pow(beam * 0.6 + beam2 * 0.4, 2.2);
          float vertFade = smoothstep(0.0, 0.85, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
          float horizFade = smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x);
          float faceFade = pow(abs(dot(normalize(vNormalW), normalize(vViewDir))), 0.6);
          float alpha = shafts * vertFade * horizFade * faceFade * 0.065;
          gl_FragColor = vec4(0.62, 0.93, 1.0, alpha);
        }
      `,
    });

    for (let i = 0; i < 4; i++) {
      const rayGeo = new THREE.PlaneGeometry(2.6, 2.8);
      const ray = new THREE.Mesh(rayGeo, rayMat);
      ray.position.set(-0.2 + i * 0.14, 0.15, -0.35 + i * 0.22);
      ray.rotation.y = (i * Math.PI) / 4 + 0.25;
      ray.rotation.z = -0.14;
      ray.renderOrder = 3;
      rayGroup.add(ray);
    }
    scene.add(rayGroup);

    // =========================================================================
    // 13. CRYSTAL-CLEAR RIMLESS CUBIC GLASS AQUARIUM (OPTICAL EDGES + FRESNEL)
    // =========================================================================
    const glassGroup = new THREE.Group();

    const glassPaneMat = new THREE.MeshPhysicalMaterial({
      color: 0xe6fbff,
      transparent: true,
      opacity: 0.11,
      roughness: 0.04,
      metalness: 0.06,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      envMapIntensity: 1.8,
      depthWrite: false,
      side: THREE.FrontSide,
    });

    const sidePlaneGeo = new THREE.PlaneGeometry(TANK_SIZE, TANK_SIZE);
    const glassSides = [
      { pos: [0, 0, HALF_OUT], rot: [0, 0, 0] },
      { pos: [0, 0, -HALF_OUT], rot: [0, Math.PI, 0] },
      { pos: [HALF_OUT, 0, 0], rot: [0, Math.PI / 2, 0] },
      { pos: [-HALF_OUT, 0, 0], rot: [0, -Math.PI / 2, 0] },
      { pos: [0, -HALF_OUT, 0], rot: [Math.PI / 2, 0, 0] },
    ];
    for (const s of glassSides) {
      const pane = new THREE.Mesh(sidePlaneGeo, glassPaneMat);
      pane.position.set(...s.pos);
      pane.rotation.set(...s.rot);
      pane.renderOrder = 10;
      glassGroup.add(pane);
    }

    const edgeThick = GLASS_THICK;
    const glassEdgeMat = new THREE.MeshPhysicalMaterial({
      color: 0x8de8de,
      emissive: 0x195e66,
      emissiveIntensity: 0.28,
      transparent: true,
      opacity: 0.42,
      roughness: 0.08,
      metalness: 0.12,
      clearcoat: 1.0,
      depthWrite: false,
    });

    const topBarX = new THREE.BoxGeometry(TANK_SIZE, 0.018, edgeThick);
    const topBarZ = new THREE.BoxGeometry(edgeThick, 0.018, TANK_SIZE - edgeThick * 2);
    const rimConfigs = [
      { geo: topBarX, pos: [0, HALF_OUT - 0.009, HALF_OUT - edgeThick * 0.5] },
      { geo: topBarX, pos: [0, HALF_OUT - 0.009, -HALF_OUT + edgeThick * 0.5] },
      { geo: topBarZ, pos: [HALF_OUT - edgeThick * 0.5, HALF_OUT - 0.009, 0] },
      { geo: topBarZ, pos: [-HALF_OUT + edgeThick * 0.5, HALF_OUT - 0.009, 0] },
    ];
    for (const rc of rimConfigs) {
      const bar = new THREE.Mesh(rc.geo, glassEdgeMat);
      bar.position.set(...rc.pos);
      bar.renderOrder = 11;
      glassGroup.add(bar);
    }

    const cornerSeamGeo = new THREE.BoxGeometry(edgeThick * 0.65, TANK_SIZE, edgeThick * 0.65);
    const seamMat = new THREE.MeshPhysicalMaterial({
      color: 0xaef2ec,
      transparent: true,
      opacity: 0.28,
      roughness: 0.12,
      metalness: 0.08,
      clearcoat: 1.0,
      depthWrite: false,
    });
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        const seam = new THREE.Mesh(cornerSeamGeo, seamMat);
        seam.position.set(sx * (HALF_OUT - edgeThick * 0.34), 0, sz * (HALF_OUT - edgeThick * 0.34));
        seam.renderOrder = 11;
        glassGroup.add(seam);
      }
    }

    const baseSlabGeo = new THREE.BoxGeometry(TANK_SIZE, edgeThick, TANK_SIZE);
    const baseSlab = new THREE.Mesh(baseSlabGeo, seamMat);
    baseSlab.position.set(0, -HALF_OUT + edgeThick * 0.5, 0);
    baseSlab.renderOrder = 9;
    glassGroup.add(baseSlab);

    const edgeWireGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK_SIZE, TANK_SIZE, TANK_SIZE));
    const edgeWireMat = new THREE.LineBasicMaterial({
      color: 0xc2f5f2,
      transparent: true,
      opacity: 0.45,
    });
    const edgeWire = new THREE.LineSegments(edgeWireGeo, edgeWireMat);
    edgeWire.renderOrder = 12;
    glassGroup.add(edgeWire);

    scene.add(glassGroup);

    // =========================================================================
    // 14. INTERACTIVE CLICK-TO-RIPPLE RAYCASTING (SMART CLICK VS DRAG)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_TOP);
    const hitPoint = new THREE.Vector3();
    const tankBox = new THREE.Box3(
      new THREE.Vector3(-HALF_OUT, -HALF_OUT, -HALF_OUT),
      new THREE.Vector3(HALF_OUT, HALF_OUT, HALF_OUT)
    );

    let downX = 0;
    let downY = 0;
    let downTime = 0;

    function triggerWaterRipple(x, z, strength = 1.0) {
      const cx = THREE.MathUtils.clamp(x, -HALF_IN + 0.08, HALF_IN - 0.08);
      const cz = THREE.MathUtils.clamp(z, -HALF_IN + 0.08, HALF_IN - 0.08);
      rippleArray[rippleCursor].set(cx, cz, sharedUniforms.uTime.value, strength);
      rippleCursor = (rippleCursor + 1) % MAX_RIPPLES;

      spawnSurfaceBubbleBurst(cx, cz);

      for (const fish of goldfishList) {
        const dx = fish.pos.x - cx;
        const dz = fish.pos.z - cz;
        const dist = Math.hypot(dx, dz);
        if (dist < 1.85) {
          fish.surgeTimer = 0.85;
          fish.targetSpeed = fish.baseSpeed * 1.65;
          if (dist > 0.05) {
            fish.vel.x += (dx / dist) * 0.25;
            fish.vel.z += (dz / dist) * 0.25;
            fish.vel.y -= 0.14;
          }
        }
      }
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      downX = e.clientX;
      downY = e.clientY;
      downTime = performance.now();
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
      const dt = performance.now() - downTime;
      if (dist > 6 || dt > 380) return;

      pointerNdc.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNdc.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNdc, camera);

      if (raycaster.ray.intersectPlane(waterPlane, hitPoint)) {
        if (Math.abs(hitPoint.x) <= HALF_IN && Math.abs(hitPoint.z) <= HALF_IN) {
          triggerWaterRipple(hitPoint.x, hitPoint.z, 1.0);
          return;
        }
      }
      if (raycaster.ray.intersectBox(tankBox, hitPoint)) {
        triggerWaterRipple(hitPoint.x, hitPoint.z, 0.92);
      }
    });

    window.__diorama = {
      triggerRipple: (x = 0, z = 0, s = 1.0) => triggerWaterRipple(x, z, s),
      setCamera: (x, y, z) => {
        camera.position.set(x, y, z);
        controls.update();
      },
    };

    // =========================================================================
    // 15. ANIMATION LOOP (ZERO-GC PRE-ALLOCATED VECTORS + KINEMATICS)
    // =========================================================================
    const _steer = new THREE.Vector3();
    const _diff = new THREE.Vector3();
    const _desiredDir = new THREE.Vector3();
    const _cross = new THREE.Vector3();
    const _up = new THREE.Vector3(0, 1, 0);
    const _mat4 = new THREE.Matrix4();
    const _targetQuat = new THREE.Quaternion();
    const _rollQuat = new THREE.Quaternion();
    const _fwdAxis = new THREE.Vector3(0, 0, 1);
    const _bubbleMat4 = new THREE.Matrix4();
    const _bubblePos = new THREE.Vector3();
    const _bubbleScale = new THREE.Vector3();
    const _unitQuat = new THREE.Quaternion();

    function updateGoldfish(dt, elapsed) {
      const boundXZ = HALF_IN - 0.56;
      const maxY = WATER_TOP - 0.34;

      for (let i = 0; i < goldfishList.length; i++) {
        const f = goldfishList[i];

        if (f.surgeTimer > 0) {
          f.surgeTimer = Math.max(0, f.surgeTimer - dt);
        } else {
          f.targetSpeed = f.baseSpeed * (0.86 + 0.24 * Math.sin(elapsed * 0.55 + i * 2.3));
        }
        f.speed = THREE.MathUtils.damp(f.speed, f.targetSpeed, 2.8, dt);

        f.wanderTimer -= dt;
        if (f.wanderTimer <= 0) {
          f.wanderAngle += (Math.random() - 0.5) * 1.45;
          f.wanderTimer = 1.2 + Math.random() * 1.8;
        }

        _steer.set(
          Math.cos(f.wanderAngle + elapsed * 0.24 + i * 1.7) * 0.55,
          (f.preferredY + Math.sin(elapsed * 0.45 + i * 2.1) * 0.32 - f.pos.y) * 0.62,
          Math.sin(f.wanderAngle + elapsed * 0.21 + i * 1.3) * 0.55
        );

        const margin = 0.62;
        if (f.pos.x > boundXZ - margin) _steer.x -= Math.pow((f.pos.x - (boundXZ - margin)) / margin, 1.7) * 2.8;
        if (f.pos.x < -boundXZ + margin) _steer.x += Math.pow((-boundXZ + margin - f.pos.x) / margin, 1.7) * 2.8;
        if (f.pos.z > boundXZ - margin) _steer.z -= Math.pow((f.pos.z - (boundXZ - margin)) / margin, 1.7) * 2.8;
        if (f.pos.z < -boundXZ + margin) _steer.z += Math.pow((-boundXZ + margin - f.pos.z) / margin, 1.7) * 2.8;

        const floorSafe = sandHeightAt(f.pos.x, f.pos.z) + 0.44;
        if (f.pos.y > maxY - 0.28) _steer.y -= ((f.pos.y - (maxY - 0.28)) / 0.28) * 2.6;
        if (f.pos.y < floorSafe + 0.28) _steer.y += ((floorSafe + 0.28 - f.pos.y) / 0.28) * 3.0;

        for (let r = 0; r < rockBounds.length; r++) {
          const rb = rockBounds[r];
          _diff.subVectors(f.pos, rb.pos);
          const d = _diff.length();
          if (d < rb.radius + 0.42 && d > 0.001) {
            _steer.addScaledVector(_diff, ((rb.radius + 0.42 - d) / d) * 2.6);
          }
        }

        for (let j = 0; j < goldfishList.length; j++) {
          if (i === j) continue;
          _diff.subVectors(f.pos, goldfishList[j].pos);
          const d = _diff.length();
          if (d < 0.92 && d > 0.001) {
            _steer.addScaledVector(_diff, ((0.92 - d) / d) * 1.9);
          }
        }

        f.vel.addScaledVector(_steer, dt * 1.35);
        f.vel.y = THREE.MathUtils.clamp(f.vel.y, -0.34, 0.34);
        if (f.vel.lengthSq() > 0.0001) {
          _desiredDir.copy(f.vel).normalize();
        } else {
          _desiredDir.copy(f.heading);
        }

        _cross.crossVectors(f.heading, _desiredDir);
        const yawTurn = THREE.MathUtils.clamp(_cross.y * 5.2, -1.0, 1.0);
        f.turnBend = THREE.MathUtils.damp(f.turnBend, yawTurn, 5.0, dt);
        f.roll = THREE.MathUtils.damp(f.roll, -yawTurn * 0.26, 4.5, dt);

        f.heading.lerp(_desiredDir, 1.0 - Math.exp(-3.4 * dt)).normalize();
        f.vel.copy(f.heading).multiplyScalar(f.speed);
        f.pos.addScaledVector(f.vel, dt);

        f.pos.x = THREE.MathUtils.clamp(f.pos.x, -boundXZ, boundXZ);
        f.pos.z = THREE.MathUtils.clamp(f.pos.z, -boundXZ, boundXZ);
        f.pos.y = THREE.MathUtils.clamp(f.pos.y, floorSafe, maxY);

        f.group.position.copy(f.pos);

        _mat4.lookAt(f.pos, _diff.copy(f.pos).sub(f.heading), _up);
        _targetQuat.setFromRotationMatrix(_mat4);
        _rollQuat.setFromAxisAngle(_fwdAxis, f.roll);
        _targetQuat.multiply(_rollQuat);
        f.group.quaternion.slerp(_targetQuat, 1.0 - Math.exp(-7.0 * dt));

        const tailFreq = 4.6 + f.speed * 5.4;
        f.uniforms.uSwimPhase.value += dt * tailFreq;
        f.uniforms.uSwimAmp.value = THREE.MathUtils.damp(
          f.uniforms.uSwimAmp.value,
          0.78 + f.speed * 0.62,
          5.0,
          dt
        );
        f.uniforms.uTurnBend.value = f.turnBend;

        const headSway = Math.sin(f.uniforms.uSwimPhase.value - 0.1 * 5.0) * 0.011 * f.uniforms.uSwimAmp.value;
        f.eyeHolder.position.x = headSway;

        const pPhase = f.uniforms.uSwimPhase.value * 0.85;
        f.pecL.rotation.y = 0.28 + Math.sin(pPhase) * 0.34;
        f.pecL.rotation.z = -0.18 + Math.cos(pPhase) * 0.16;
        f.pecR.rotation.y = -0.28 - Math.sin(pPhase + 0.35) * 0.34;
        f.pecR.rotation.z = 0.18 - Math.cos(pPhase + 0.35) * 0.16;
      }
    }

    function updateBubbles(dt, elapsed) {
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const b = bubbles[i];
        b.y += b.speed * dt;
        if (b.y >= WATER_TOP - 0.025) {
          resetBubble(b, false, null);
        }
        const x = b.baseX + Math.sin(elapsed * b.wobbleFreq + b.phase) * b.wobbleAmp;
        const z = b.baseZ + Math.cos(elapsed * (b.wobbleFreq * 0.82) + b.phase) * b.wobbleAmp;
        const squish = 1.0 + 0.12 * Math.sin(elapsed * 6.0 + b.phase);
        _bubblePos.set(
          THREE.MathUtils.clamp(x, -HALF_IN + 0.06, HALF_IN - 0.06),
          b.y,
          THREE.MathUtils.clamp(z, -HALF_IN + 0.06, HALF_IN - 0.06)
        );
        _bubbleScale.set(b.radius * squish, b.radius * (0.86 / squish), b.radius * squish);
        _bubbleMat4.compose(_bubblePos, _unitQuat, _bubbleScale);
        bubbleMesh.setMatrixAt(i, _bubbleMat4);
      }
      bubbleMesh.instanceMatrix.needsUpdate = true;
    }

    setTimeout(() => {
      triggerWaterRipple(0.18, 0.12, 0.55);
    }, 600);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastTime = performance.now();
    let frameId = 0;

    function afterDraw(cb) {
      const gl = renderer.getContext();
      const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
      gl.flush();
      const poll = () => {
        const state = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
        if (state === gl.UNSIGNALED) {
          frameId = window.setTimeout(poll, 5);
        } else {
          if (sync) gl.deleteSync(sync);
          frameId = window.setTimeout(cb, 80);
        }
      };
      frameId = window.setTimeout(poll, 5);
    }

    function tick() {
      const now = performance.now();
      const dt = Math.min((now - lastTime) * 0.001, 0.05);
      lastTime = now;

      sharedUniforms.uTime.value += dt;
      const elapsed = sharedUniforms.uTime.value;

      updateGoldfish(dt, elapsed);
      updateBubbles(dt, elapsed);
      controls.update();

      renderer.render(scene, camera);

      if (isSoftwareGl) {
        afterDraw(tick);
      } else {
        frameId = requestAnimationFrame(tick);
      }
    }

    updateBubbles(0.016, 0);
    tick();
  </script>
</body>

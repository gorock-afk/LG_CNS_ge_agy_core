<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>LG CNS · Antigravity & Gemini 핵심 실습 포털</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --accent: #A50034;
      --accent-dark: #8A002B;
      --accent-muted: #475569;
      --accent-soft: #FDF2F4;
      --accent-border: #F5C2CE;
      --point-burgundy: #A50034;
      --bg-main: #ffffff;
      --bg-surface: #f8fafc;
      --bg-sidebar: #fafafa;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --divider-color: #f3f4f6;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 2px 8px rgba(15, 23, 42, 0.06);
      --font-sans: "Google Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 15.5px; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle 2px LG Signature Progress Bar */
    .top-brand-bar {
      height: 2px; background: #f1f5f9; width: 100%; position: fixed; top: 0; left: 0; z-index: 1000;
    }
    .reading-progress-bar {
      height: 2px; background: var(--accent); width: 0%; position: fixed; top: 0; left: 0; z-index: 1001; transition: width 0.1s ease-out;
    }

    /* Minimal Toned-Down Header */
    header.app-header {
      position: sticky; top: 2px; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color); z-index: 990; padding: 0.6rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 0.65rem; }
    .brand-pill {
      background: var(--accent); color: #ffffff; border: 1px solid var(--accent);
      font-weight: 700; font-size: 0.72rem; padding: 0.2rem 0.55rem; border-radius: 5px; letter-spacing: 0.04em;
    }
    .header-title { font-weight: 700; font-size: 1.05rem; color: #111827; letter-spacing: -0.02em; }
    .header-title span { color: var(--accent); font-weight: 700; }

    /* Calm Part Filter Bar */
    .part-nav-bar {
      background: #ffffff; border-bottom: 1px solid var(--border-color);
      padding: 0.45rem 1.5rem; position: sticky; top: 53px; z-index: 980;
      display: flex; align-items: center; gap: 0.4rem; overflow-x: auto;
    }
    .part-tab {
      border: 1px solid transparent; background: transparent; color: #64748b;
      padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
    }
    .part-tab:hover { background: #FDF2F4; color: var(--accent); }
    .part-tab.active {
      background: var(--accent); color: #ffffff; border-color: var(--accent);
    }

    .header-right { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; font-weight: 600;
      padding: 0.38rem 0.8rem; border-radius: 6px; text-decoration: none; border: 1px solid #d1d5db;
      background: #ffffff; color: #374151 !important; cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { background: #f9fafb; border-color: #9ca3af; color: #111827 !important; }
    .btn-zip {
      background: var(--accent); color: #ffffff !important; border-color: var(--accent);
    }
    .btn-zip:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #ffffff !important; }
    .btn-primary {
      background: #ffffff; color: var(--accent) !important; border-color: var(--accent-border);
    }
    .btn-primary:hover { background: var(--accent-soft); border-color: var(--accent); }

    .portal-layout {
      display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1320px; margin: 0 auto;
    }
    @media (max-width: 980px) {
      .portal-layout { grid-template-columns: 1fr; }
      aside.toc-sidebar { display: none; }
    }

    /* Notion / Linear Style Clean Left Sidebar */
    aside.toc-sidebar {
      position: sticky; top: 96px; height: calc(100vh - 96px); overflow-y: auto;
      background: var(--bg-sidebar); border-right: 1px solid var(--border-color); padding: 1rem 0.75rem 3rem;
    }
    .toc-zip-card { display: none; }
    .toc-search-box {
      width: 100%; padding: 0.42rem 0.65rem; border: 1px solid #e5e7eb;
      border-radius: 6px; font-size: 0.79rem; margin-bottom: 0.8rem; background: #fff; color: #374151;
    }
    .toc-search-box:focus { outline: none; border-color: var(--accent); }
    .toc-group-label {
      font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase;
      padding: 0.5rem 0.5rem 0.25rem; margin-top: 0.65rem;
      border-top: 1px solid #f1f5f9; letter-spacing: 0.02em;
      display: flex; align-items: center; gap: 0.3rem; cursor: pointer;
    }
    .toc-group-label:first-of-type { margin-top: 0; border-top: none; padding-top: 0.1rem; }
    .toc-link {
      display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: #4b5563; font-size: 0.81rem; font-weight: 500;
      padding: 0.32rem 0.5rem 0.32rem 0.65rem; border-radius: 5px; margin-bottom: 1px;
      line-height: 1.35; border-left: 2px solid transparent; transition: all 0.12s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toc-link:hover { background: #f3f4f6; color: #111827; }
    .toc-link.active {
      background: var(--accent-soft); color: var(--accent); font-weight: 700; border-left-color: var(--accent);
    }
    .toc-link.challenge-item { color: #6b7280; font-weight: 500; }
    .toc-link.challenge-item.active {
      background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent);
    }

    main.reader-content {
      padding: 2rem 3rem 5rem; max-width: 920px; width: 100%;
    }
    @media (max-width: 640px) { main.reader-content { padding: 1.25rem 1rem 4rem; } }

    /* Clean Neutral Hero Card */
    .lab-reader-hero {
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg); padding: 1.5rem 1.75rem; margin-bottom: 2rem;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.35rem; background: var(--accent-soft);
      color: var(--accent); border: 1px solid var(--accent-border); font-size: 0.74rem; font-weight: 700; padding: 0.22rem 0.6rem;
      border-radius: 4px; margin-bottom: 0.65rem;
    }
    .hero-title { font-size: 1.65rem; font-weight: 800; color: #111827; line-height: 1.3; margin-bottom: 0.45rem; letter-spacing: -0.02em; }
    .hero-desc { font-size: 0.94rem; color: #4b5563; margin-bottom: 0.9rem; }
    .hero-actions { display: none; }
    .meta-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .meta-chip {
      font-size: 0.78rem; background: #ffffff; border: 1px solid #e2e8f0;
      padding: 0.22rem 0.65rem; border-radius: 6px; color: #4b5563; font-weight: 500;
    }

    /* Clean Section Headings */
    .markdown-body h1 {
      font-size: 1.45rem; font-weight: 800; margin-top: 3rem; margin-bottom: 1.1rem;
      padding: 0 0 0.65rem 0; background: transparent; color: #111827;
      border-bottom: 2px solid #e5e7eb; border-radius: 0; box-shadow: none; letter-spacing: -0.02em;
    }

    .markdown-body h2, .markdown-body h3 {
      font-size: 1.12rem; font-weight: 700; margin-top: 2.1rem; margin-bottom: 0.9rem;
      padding: 0.6rem 0.95rem; background: #f8fafc;
      border: 1px solid #e5e7eb; border-left: 3px solid var(--accent); border-radius: 6px;
      color: #111827; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .markdown-body h3.challenge-heading {
      background: #fafafa; border-left-color: var(--accent); border-style: dashed; border-left-style: solid;
    }
    .step-pill {
      background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 700;
      padding: 0.16rem 0.52rem; border-radius: 4px; letter-spacing: 0.03em; flex-shrink: 0;
    }
    .step-pill.challenge-pill { background: var(--accent); }
    .step-check-btn {
      margin-left: auto; background: #ffffff; border: 1px solid #d1d5db; color: #6b7280;
      font-size: 0.73rem; font-weight: 600; padding: 0.18rem 0.55rem; border-radius: 5px; cursor: pointer;
    }
    .step-check-btn:hover { border-color: #9ca3af; color: #111827; }
    .step-check-btn.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .markdown-body p { margin-bottom: 0.8rem; color: #374151; font-size: 0.97rem; }
    .markdown-body ul, .markdown-body ol { margin-bottom: 0.95rem; padding-left: 1.4rem; color: #374151; }
    .markdown-body li { margin-bottom: 0.32rem; font-size: 0.96rem; }
    .markdown-body strong { color: #111827; font-weight: 700; }

    /* Toned-down Neutral Inline Code (`...`) */
    .markdown-body :not(pre) > code {
      background: #f3f4f6 !important; color: #1f2937 !important; border: 1px solid #e5e7eb !important;
      padding: 0.12rem 0.38rem !important; border-radius: 4px !important; font-family: var(--font-mono) !important;
      font-size: 0.86em !important; font-weight: 600 !important;
    }
    .markdown-body a > code {
      background: var(--accent-soft) !important; color: var(--accent) !important; border-color: var(--accent-border) !important;
      text-decoration: underline !important; text-underline-offset: 3px !important; font-weight: 600 !important;
    }
    .markdown-body a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }

    /* Calm Callout Blockquote */
    .markdown-body blockquote {
      background: #f9fafb; border: 1px solid #e5e7eb; border-left: 3px solid var(--accent);
      border-radius: 6px; padding: 0.75rem 1.05rem; margin: 0.9rem 0; color: #4b5563; font-size: 0.92rem;
    }

    /* Toned-down Neutral Prompt Card */
    .code-block-wrapper {
      margin: 1rem 0 1.3rem; border-radius: 8px; overflow: hidden;
      border: 1px solid #d1d5db; background: #ffffff; box-shadow: var(--shadow-sm);
    }
    .code-block-header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap;
      padding: 0.42rem 0.9rem; background: #f8fafc;
      border-bottom: 1px solid #e5e7eb; font-size: 0.77rem; font-weight: 600; color: #475569;
      user-select: none; -webkit-user-select: none;
    }
    .ag-header-chip {
      display: inline-flex; align-items: center; gap: 0.25rem;
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid var(--accent-border); border-radius: 4px;
      padding: 0.08rem 0.42rem; font-family: var(--font-mono); font-weight: 700; font-size: 0.75rem;
    }
    .ag-header-kbd {
      display: inline-block; background: #ffffff; color: #374151;
      border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: 4px;
      padding: 0.05rem 0.35rem; font-family: var(--font-sans); font-size: 0.7rem; font-weight: 700;
    }
    /* Non-copyable Antigravity Skill Chip inside Prompt Body (rendered via CSS pseudo-elements so it cannot be copied) */
    .ag-skill-chip {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: var(--accent-soft); border: 1.5px solid var(--accent-border);
      border-radius: 6px; padding: 0.14rem 0.55rem; margin-right: 0.48rem; margin-bottom: 0.15rem;
      vertical-align: baseline; user-select: none; -webkit-user-select: none; -moz-user-select: none;
      cursor: default;
    }
    .ag-skill-chip::before {
      content: attr(data-cmd);
      color: var(--accent); font-family: var(--font-mono); font-weight: 800; font-size: 0.86rem;
    }
    .ag-skill-chip::after {
      content: attr(data-kbd);
      background: #ffffff; color: #475569; border: 1px solid #cbd5e1; border-bottom-width: 2px;
      border-radius: 4px; padding: 0.04rem 0.36rem; font-family: var(--font-sans);
      font-size: 0.68rem; font-weight: 700; letter-spacing: -0.01em;
    }
    .code-copy-btn {
      display: inline-flex; align-items: center; gap: 0.3rem; background: #ffffff;
      border: 1px solid var(--accent-border); border-radius: 5px; font-size: 0.75rem; font-weight: 600;
      padding: 0.22rem 0.65rem; cursor: pointer; color: var(--accent); transition: all 0.15s;
    }
    .code-copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .code-copy-btn.copied { background: var(--accent-dark) !important; color: #fff !important; border-color: var(--accent-dark) !important; }

    .markdown-body pre {
      margin: 0 !important; padding: 0.95rem 1.1rem !important; background: #ffffff !important;
      overflow-x: auto; font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.65;
      color: #111827 !important; white-space: pre-wrap !important; word-break: keep-all; overflow-wrap: break-word !important;
    }
    .markdown-body pre > code {
      background: transparent !important; color: inherit !important; border: none !important; padding: 0 !important;
      white-space: pre-wrap !important; word-break: keep-all; overflow-wrap: break-word !important; display: block;
    }
    .prompt-card pre {
      overflow-x: hidden !important;
    }

    /* Clean Screenshot Frame */
    .screenshot-figure {
      margin: 0.9rem 0 1.5rem; display: flex; flex-direction: column; align-items: flex-start;
    }
    .screenshot-frame {
      position: relative; display: inline-block; max-width: 680px; width: 100%;
      border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;
      box-shadow: var(--shadow-md); background: #ffffff; cursor: zoom-in; transition: border-color 0.15s;
    }
    .screenshot-frame:hover { border-color: #94a3b8; }
    .screenshot-frame img {
      display: block; width: 100%; height: auto; max-height: 440px; object-fit: contain; background: #fff;
    }
    .zoom-hint {
      position: absolute; bottom: 8px; right: 10px; background: rgba(15, 23, 42, 0.72);
      color: #fff; font-size: 0.7rem; font-weight: 500; padding: 2px 7px; border-radius: 4px;
      pointer-events: none;
    }
    .screenshot-caption {
      margin-top: 0.38rem; font-size: 0.8rem; color: #6b7280; font-weight: 500;
    }

    .markdown-body table {
      width: 100%; border-collapse: collapse; margin: 1rem 0 1.4rem; font-size: 0.88rem;
      border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;
    }
    .markdown-body th {
      background: #f9fafb; color: #111827; font-weight: 700; padding: 0.65rem 0.85rem;
      border-bottom: 1px solid #e5e7eb; text-align: left;
    }
    .markdown-body td {
      padding: 0.6rem 0.85rem; border-bottom: 1px solid #f3f4f6; color: #374151;
    }

    .markdown-body details {
      margin: 0.75rem 0 1.4rem; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #f8fafc; overflow: hidden;
    }
    .markdown-body details > summary {
      padding: 0.65rem 1rem; cursor: pointer; font-size: 0.9rem; color: #334155;
      background: #f8fafc; user-select: none; transition: background 0.15s;
    }
    .markdown-body details > summary:hover {
      background: #f1f5f9; color: #111827;
    }
    .markdown-body details[open] > summary {
      border-bottom: 1px solid #e2e8f0; background: #f1f5f9;
    }
    .markdown-body details table {
      margin: 0; border: none; border-radius: 0; background: #ffffff;
    }

    .lightbox-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88);
      z-index: 2000; align-items: center; justify-content: center; padding: 2rem; cursor: zoom-out;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 94vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); background: #fff;
    }
  </style>
</head>
<body>
  <div class="top-brand-bar"></div>
  <div class="reading-progress-bar" id="progress-bar"></div>

  <header class="app-header">
    <div class="header-left">
      <span class="brand-pill">LG CNS</span>
      <div class="header-title">Antigravity &amp; <span>Gemini 4</span> 개발자 실습 포털</div>
    </div>
    <div class="header-right">
      <a href="./LGCNS_Workshop_Slides.pdf" target="_blank" class="btn btn-zip">📄 강의 슬라이드 PDF 보기</a>
    </div>
  </header>

  <nav class="part-nav-bar" id="part-nav">
    <button class="part-tab active" onclick="filterPart('all', this)">전체 보기</button>
    <button class="part-tab" onclick="filterPart('part-0', this)">Part 0. 로그인·제어</button>
    <button class="part-tab" onclick="filterPart('part-1', this)">Part 1. 설계·자동검증</button>
    <button class="part-tab" onclick="filterPart('part-2', this)">Part 2. 3모델 비교·과제</button>
    <button class="part-tab" onclick="filterPart('part-3', this)">Part 3. 멀티에이전트</button>
    <button class="part-tab" onclick="filterPart('part-4', this)">Part 4. Hook &amp; 보안</button>
    <button class="part-tab" onclick="filterPart('part-5', this)">Part 5. Gemini 데스크탑</button>
  </nav>

  <div class="portal-layout">
    <aside class="toc-sidebar">
      <input type="text" class="toc-search-box" id="toc-search" placeholder="🔍 메뉴 빠른 검색..." oninput="filterToc(this.value)">
      <div id="toc-container"></div>
    </aside>

    <main class="reader-content">
      <div class="lab-reader-hero">
        <div class="hero-badge">ZERO-DOWNLOAD HANDS-ON · PRACTICAL TECH PROMPTS</div>
        <h1 class="hero-title">LG CNS · Antigravity &amp; Gemini 개발자 실습 가이드</h1>
        <p class="hero-desc">
          번거로운 파일 다운로드 없이 <strong>빈 폴더 하나만 열고</strong> 현업에서 쓰듯 자연스러운 프롬프트를 복사해 바로 실행해 보세요.
        </p>
        <div class="meta-chips">
          <span class="meta-chip">사전 파일: <strong>다운로드 불필요</strong></span>
          <span class="meta-chip">실습 비교 모델: <strong>Hydrogen · Neon · Claude Opus 5.5</strong></span>
          <span class="meta-chip">이미지 클릭 시 <strong>원본 확대(Zoom)</strong></span>
        </div>
      </div>

      <div id="markdown-container" class="markdown-body"></div>
    </main>
  </div>

  <div class="lightbox-overlay" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightbox-img" src="" alt="확대 이미지">

  <script>
    const EMBEDDED_MD = "# LG CNS · Antigravity & Gemini 개발자 실습 가이드\n\n> **파일 다운로드 0건 · 실무 눈높이 프롬프트 실습**  \n> 별도 첨부파일이나 브라우저 원격 제어 설정 없이 **빈 폴더 하나만 열고**, 현업에서 동료 개발자에게 말하듯 자연스러운 한 줄 프롬프트를 날려 설계 · 코딩 · 터미널 자동 검증 · 보안 Hook 설정까지 바로 체험합니다.\n\n---\n\n## 0. 전체 커리큘럼 로드맵 & 1줄 초기 세팅\n\n| 파트 | 시간 (90분 / 180분) | 핵심 주제 | 현업 실습 시나리오 (첨부파일 불필요) |\n| :--- | :---: | :--- | :--- |\n| **Part 0** | 10분 / 15분 | 환경 세팅 · 샌드박스 제어 · 보안 정책 | 기업 계정 로그인, `Proceed in sandbox` · `accept-edits`, `/btw`, `admin_settings.json` |\n| **Part 1** | 25분 / 45분 | 설계 질문 ~ 터미널 자율 점검 | 사내 예약 서비스를 `/grill-me` ➔ `/plan` ➔ `/goal` 자동 테스트로 완성 |\n| **Part 2** | 25분 / 50분 | 3종 모델(`Hydrogen · Neon · Opus 5.5`) 비교 | 한 줄 3D 비교 + 선착순 중복 방지 · 서버 호출 꼬임 · 결제 오류 수정 |\n| **Part 3** | 15분 / 35분 | 멀티에이전트 · Global/Project 규칙 | `/boost`, `/teamwork`, 전역(`~/.gemini`) vs 프로젝트(`.md`) 규칙·플러그인 |\n| **Part 4** | 10분 / 20분 | 보안 Hook 가드레일 & 사내 MCP 정책 | 위험 명령(`rm -rf`·`DROP TABLE`) 및 `.env` 접근 차단 Hook + 승인 MCP 안내 |\n| **Part 5** | 5분 / 15분 | Gemini 데스크탑 앱 미리보기 | 코딩(Antigravity) vs 일상 업무(Gemini 데스크탑), 전사 `Skill` 공유 |\n\n1️⃣ **실습 시작 전 터미널에서 빈 작업 폴더 하나만 만들고 Antigravity로 엽니다**:\n\n```bash\nmkdir -p ~/lgcns-agy-lab && cd ~/lgcns-agy-lab && git init\n```\n\n---\n\n# 💻 Part 0. 환경 세팅 · 무중단 제어 & 엔터프라이즈 거버넌스\n\n### 🔹 Step 0-1. 기업 계정 2단계 로그인 (앱 · CLI · VS Code 공통)\n\n> **핵심:** 개인 Gmail이 아닌 **기업 Google Cloud 계정**으로 로그인해야 사내 라이선스 쿼터와 보안 정책이 적용됩니다.\n\n1️⃣ 첫 화면에서 회색 **`Use Business Account`** 버튼을 클릭합니다. (`Continue with Google` 클릭 금지)\n![Step 0-1-1 Use Business Account 선택](assets/screenshots/agy_login_step1_business.png)\n\n2️⃣ 다음 화면에서 파란색 **`Continue with Google Cloud`**를 눌러 인증을 완료하고, 우측 하단 모델 선택창에 **`Gemini 4 Hydrogen` · `Neon` · `Claude Opus 5.5`**가 모두 보이는지 확인합니다. (`Antigravity 앱`, 터미널 `agy` CLI, `VS Code 확장` 모두 동일)\n![Step 0-1-2 Continue with Google Cloud 클릭](assets/screenshots/agy_login_step2_gcloud.png)\n\n---\n\n### 🔹 Step 0-2. 승인 피로도 줄이기 (`Proceed in sandbox` · `accept-edits`) & `/btw` 조향\n\n> **권장 버전 (Windows 패치 반영):** `AGY Desktop 2.32.1+` · `CLI 1.5.7+` · `VS Code 확장 1.13.0+` 이상을 사용합니다.\n\n1️⃣ **`Turbo` 차단 환경에서의 실무 권장 모드 (`Proceed in sandbox` & `Allow/Deny`)**:\n- 기업 보안 정책상 외부 폴더·웹·MCP까지 일괄 허용하는 `Turbo`는 잠겨 있는 것이 표준입니다.\n- 대신 프로젝트 콘솔을 **`Proceed in sandbox`**로 두고(CLI는 `Shift + Tab`으로 **`accept-edits`** 전환), **`admin_settings.json`(MDM)** 또는 로컬 설정으로 안전한 빌드·조회 명령(`pytest`, `git status`, `python3`)은 **`Allow`**, 파괴적 명령(`rm -rf`, `DROP TABLE`) 및 **`.env` 파일 접근은 `Deny`**로 분리하면 보안과 개발 속도를 동시에 잡을 수 있습니다.\n\n2️⃣ **작업 중 끼어들기(`Send Immediately`) & 가벼운 옆 질문(`/btw`)**: 에이전트가 한창 코드를 짜는 중에도 멈추지 않고 조건을 보태거나, 작업 흐름을 어지럽히지 않고 간단한 확인 질문만 던질 수 있습니다.\n\n```text\n/btw 지금 내 PC에 깔린 파이썬 버전이랑 안 쓰는 빈 포트 번호 하나만 짧게 알려줘.\n```\n\n3️⃣ **Enterprise Gateway & MDM 일괄 제어 (`admin_settings.json`)**:\n- **사내 Proxy 연동**: LiteLLM 및 사내 LLM 게이트웨이·중앙 GCP 서비스 계정으로 트래픽과 예산을 한곳에서 관리합니다.\n- **동일 보안 정책**: `admin_settings.json` 배포 하나로 앱 · CLI · VS Code 확장의 허용 모델, 샌드박스 상한, 명령어 `Allow/Deny` 정책을 똑같이 통제합니다.\n\n---\n\n# 🛠️ Part 1. 설계 리뷰 ~ 터미널 자율 디버깅\n\n### 🔹 Step 1-1. `/grill-me` 먼저 질문받기 ➔ `/plan` 계획 확인\n\n> **핵심:** 대충 시켜서 수백 줄 짠 뒤 처음부터 다시 고치지 않도록, 에이전트가 **애매한 업무 규칙부터 먼저 질문(`/grill-me`)**하게 하고 작업 계획서(`/plan`)를 눈으로 확인한 뒤 시작합니다.\n\n1️⃣ 빈 폴더에서 `/grill-me`를 고르고 평소에 일 시키듯 편하게 입력합니다.\n\n```text\n/grill-me 사내 회의실이랑 테스트 장비를 시간대별로 예약하는 서비스를 만들 건데, 코딩하기 전에 중복 예약이나 취소 규칙처럼 먼저 정해야 할 것들부터 질문해줘.\n```\n\n2️⃣ 질문 카드에 답한 뒤, `/plan`으로 어떤 파일과 자동 검증 테스트를 만들지 계획서부터 받습니다. (계획서 문장을 드래그해 코멘트로 수정 지시를 남길 수도 있습니다.)\n\n```text\n/plan 방금 정한 규칙대로 예약 처리 API 로직과, 시간 겹침·예약 취소·빈 목록 조회를 검증하는 파이썬 자동 테스트 계획을 세워줘.\n```\n\n---\n\n### 🔹 Step 1-2. `/goal` 터미널 자동 테스트 실행 및 끝까지 고치기\n\n> **핵심:** 사내 보안 정책 때문에 브라우저 원격 연결이 막히거나 일일이 손으로 눌러보기 번거로울 때도, 에이전트가 **터미널에서 자동 검증 테스트를 직접 돌려보고 전부 통과할 때까지 알아서 고치고 재실행(`/goal`)**하게 합니다.\n\n1️⃣ `/goal`을 선택하고 터미널 테스트 통과 기준만 명확히 적어줍니다.\n\n```text\n/goal 계획대로 예약 서비스 코드와 자동 검증 테스트를 만들고, 시간 겹침·예약 취소·빈 목록 조회 테스트가 터미널에서 전부 통과할 때까지 알아서 고쳐줘.\n```\n\n2️⃣ 초기 테스트 실패(`FAIL`)가 나오면 에이전트가 스스로 터미널 에러 로그를 읽고 코드를 수정해 전체 **`PASS`**까지 완주하는 흐름을 확인합니다.\n![Step 1-2-1 초기 테스트 실패 감지 예시](assets/screenshots/p1_selftest_fail.png)\n![Step 1-2-2 자율 수정 완료 후 전체 PASS 상태](assets/screenshots/p1_selftest_pass.png)\n\n---\n\n### 🔹 Step 1-3. `/generative_ui` 채팅창 안에 바로 띄우는 계산기 위젯\n\n> **핵심:** 따로 웹 화면을 만들지 않아도, 회의나 설계 중 필요한 계산기·시뮬레이터를 채팅창 안에 바로 띄워 슬라이더로 움직여 볼 수 있습니다.\n\n```text\n/generative_ui 동시 접속자 수랑 평균 응답 시간을 슬라이더로 움직이면 필요한 서버 대수와 예상 월 비용을 바로 계산해주는 위젯을 띄워줘.\n```\n\n![Step 1-3 채팅창 안에 즉시 렌더링되는 인터랙티브 위젯](assets/screenshots/generative_ui_calculator.png)\n\n---\n\n# 🧠 Part 2. 3종 모델(`Hydrogen · Neon · Claude Opus 5.5`) 비교 & 실무 과제\n\n### 🔹 Step 2-1. 3종 모델(`Hydrogen · Neon · Claude Opus 5.5`) 역할 & 한 줄 3D 비교\n\n| 모델 라인업 | 실습 활용 비중 · 역할 | 언제 골라 쓰나? |\n| :--- | :--- | :--- |\n| **Gemini 4 Neon** | **[신규 추가 · 올라운드 주력]** 속도·완성도·설계 균형 | 중대형 신규 기능 구현, 여러 모듈 연결, 동시성·보안 등 까다로운 오류 수정 주력 |\n| **Gemini 4 Hydrogen** | **[고속 반복 코딩]** 빠른 응답 · 가벼운 루프 | 평소 API·화면 스캐폴딩, 테스트 코드 보강, 빠른 반복 수정 루프 |\n| **Claude Opus 5.5** | **[타사 플래그십 비교군]** 단일 환경 내 직접 비교 | 별도 CLI 설치 없이 Antigravity 안에서 `Hydrogen · Neon`과 속도·토큰·완성도 교차 비교 |\n| *(참고) Gemini 4 Gluon* | *초경량 · 대량 단순 처리* | *단순 포맷 변환, 반복 템플릿 생성, 짧은 요약* |\n\n1️⃣ 새 대화창 **세 개**를 열어 각각 **`Hydrogen`** · **`Neon`** · **`Claude Opus 5.5`**로 맞춘 뒤, 똑같은 한 줄 문장을 보내 **응답 속도 · 충돌 회피 디테일 · 소모 토큰 대비 화면 완성도** 3단 차이를 눈으로 비교합니다.\n\n```text\nHTML 파일 하나로 물류 창고에서 로봇 여러 대가 서로 부딪히지 않고 선반 박스를 출고장까지 나르는 3D 화면을 만들어줘.\n```\n\n![Step 2-1 단일 프롬프트 3D 화면 생성 예시](assets/screenshots/lg_jelly_robot_demo.png)\n\n---\n\n### 🔹 Step 2-1B. 3D 프롬프트 샘플 갤러리 (스크린샷 미리보기 · 클릭 시 새 탭 실행)\n\n> **참고:** 3D 화면을 페이지에 한꺼번에 띄우면 PC 부하가 크므로, 아래에는 **실제 생성 결과 스크린샷**만 가볍게 올려두었습니다. 직접 돌려보고 싶은 샘플만 **링크를 눌러 새 탭에서 실행**해 보세요.\n\n#### ② 3D 파도 서핑/보트 항해 미니게임 (게임 물리 + 부력 + 파도)\n\n```text\n단일 HTML 파일(Three.js)로 노을 지는 바다에서 파도를 타는 3D 보트 항해 미니게임을 만들어줘.\n- 외부 에셋 없이 100% 프로시저럴 3D로 구현\n- 실시간 3D 파도 높이에 맞춰 보트가 실제로 기울고 뜨는 부력 물리, 보트 뒤로 남는 흰 물결(wake)과 물보라 파티클\n- 키보드(WASD/방향키)로 조종하며 바다 위 부표/코인을 통과하고 바위 암초를 피하는 게임 루프\n- 해질녘 태양 반사광, 떠다니는 갈매기, 좌상단에 점수·속도만 작게 표시\n```\n\n| 샘플 A — [새 탭에서 3D 실행 ↗](./demos/boat_a.html) | 샘플 B — [새 탭에서 3D 실행 ↗](./demos/boat_b.html) |\n| :---: | :---: |\n| ![3D 파도 서핑 보트 샘플 A](assets/screenshots/demo_boat_a.png) | ![3D 파도 서핑 보트 샘플 B](assets/screenshots/demo_boat_b.png) |\n\n#### ③ 투명 유리 어항 속 3D 금붕어 & 수면 물결 피규어 (물 굴절·투명도·애니메이션)\n\n```text\n단일 HTML 파일(Three.js)로 투명한 정육면체 유리 어항 속 3D 금붕어 디오라마를 만들어줘.\n- 외부 에셋 없이 100% 프로시저럴 3D로 구현\n- 어항 상단의 실시간 물결치는 수면, 바닥 모래에 비치는 물빛 굴절(caustics) 패턴, 올라가는 공기방울 파티클\n- 지느러미와 꼬리가 부드럽게 흔들리며 어항 속을 유영하는 3D 금붕어 3마리와 흔들리는 수초\n- 마우스 클릭 시 수면에 파문이 퍼지고, 드래그로 360도 회전/줌 가능, 불필요한 UI 없이 깔끔한 전체 화면\n```\n\n| 샘플 A — [새 탭에서 3D 실행 ↗](./demos/aquarium_a.html) | 샘플 B — [새 탭에서 3D 실행 ↗](./demos/aquarium_b.html) |\n| :---: | :---: |\n| ![투명 어항 3D 금붕어 샘플 A](assets/screenshots/demo_aquarium_a.png) | ![투명 어항 3D 금붕어 샘플 B](assets/screenshots/demo_aquarium_b.png) |\n\n#### ④ 공중 부양 폭포섬 3D 피규어 (흐르는 폭포 + 연못 파문 + 물안개)\n\n```text\n단일 HTML 파일(Three.js)로 공중에 떠 있는 3D 판타지 폭포섬 피규어를 만들어줘.\n- 외부 에셋 없이 100% 프로시저럴 3D로 구현\n- 절벽 위 연못에서 아래로 떨어지는 실시간 폭포수(흐르는 물줄기 + 바닥 물안개/물보라 파티클 + 연못 파문)\n- 섬 위에 돌아가는 나무 풍차, 바람에 흔들리는 나무, 떠다니는 작은 바위 조각들\n- 따뜻한 오후 햇살 그림자, 마우스 드래그로 360도 회전 및 줌 가능, UI 없이 전체 화면 표시\n```\n\n| 샘플 A — [새 탭에서 3D 실행 ↗](./demos/waterfall_a.html) | 샘플 B — [새 탭에서 3D 실행 ↗](./demos/waterfall_b.html) |\n| :---: | :---: |\n| ![공중 부양 폭포섬 샘플 A](assets/screenshots/demo_waterfall_a.png) | ![공중 부양 폭포섬 샘플 B](assets/screenshots/demo_waterfall_b.png) |\n\n---\n\n### 🔹 Step 2-2. `Hydrogen · Neon · Claude Opus 5.5`를 바꿔가며 풀어보는 현업 과제 3선\n\n> **핵심:** 아래 3가지 실무 문제를 **`Hydrogen` · `Neon` · `Claude Opus 5.5`**로 바꿔가며 돌려보면, 빠른 반복 구현부터 까다로운 예외 방어까지 모델별 성향과 `Neon`의 실무 가성비가 바로 체감됩니다.\n\n1️⃣ **[과제 A — 선착순 이벤트 동시 신청 시 수량 초과 막기 (`Hydrogen` vs `Neon` 추천)]**\n\n```text\n선착순 쿠폰 100장에 사람 500명이 동시에 몰릴 때 100장 넘게 발급되는 버그 상황을 파이썬으로 먼저 재현하고, 딱 100장만 정확히 나가도록 고쳐서 테스트로 증명해줘.\n```\n\n2️⃣ **[과제 B — 사내 서버 간 무한 호출 & 먹통 주의 구간 찾기 (`Neon` vs `Claude Opus 5.5` 추천)]**\n\n```text\n사내 서비스 20개가 서로 API를 부르는 샘플 구조를 만들고, 어디서 서로 무한 호출이 도는지랑 어느 서버 하나가 죽으면 전체가 멈추는지 한눈에 보여주는 화면을 만들어줘.\n```\n\n3️⃣ **[과제 C — 오래된 결제 코드의 금액 오차 & 검색창 보안 구멍 메우기 (`Neon` vs `Claude Opus 5.5` 추천)]**\n\n```text\n소수점 수수료 계산 오차랑 검색창 해킹 위험이 들어있는 샘플 정산 코드와 테스트를 먼저 만든 다음, 테스트 코드는 건드리지 말고 정산 코드만 안전하게 고쳐서 통과시켜줘.\n```\n\n---\n\n### 🔹 Step 2-3. 외부 공인 벤치마크 (Cursor · Arena · Artificial Analysis) & 모델 선택 기준\n\n> **기준 시점:** 2026년 11월 공개 리더보드 기준 ([CursorBench 4.1](https://cursor.com) · [Arena](https://arena.ai) · [Artificial Analysis](https://artificialanalysis.ai))\n\n| 모델 | CursorBench 4.1 (IDE 실전 코딩) | Arena (`arena.ai`) | Artificial Analysis (`v5.0.1`) | API 단가 (1M 입/출력) |\n| :--- | :---: | :--- | :---: | :---: |\n| **Gemini 4 Neon** | **65.4%** (`XHigh`, `$10.67`/작업) | Text **#3** (`1,512`) · WebDev **#5** (`1,765`) · Agent **#3** | **61** (`XHigh` · `High 60.1`) | **`$3.00 / $15.00`** |\n| **Gemini 4 Hydrogen** | **61.4%** (`XHigh`, `$8.09`/작업) | WebDev **#14** (`1,701`) · Agent **#9** | **54** (`XHigh` · `High 51`) | **`$1.50 / $7.50`** |\n| **Claude Opus 5.5** | **58.1%** (`Max`, `$11.88`/작업) | Text · WebDev 상위권 경합 | **59** (`Max`) | `$4.00 / $20.00` |\n| *(참고) Gemini 4 Carbon* | **61.5%** (`High`, `$8.52`/작업) | Text **#1** (`1,527`) · WebDev **#4** (`1,769`) | **60** (`High`) | `$4.00 / $20.00` |\n\n1️⃣ **세 모델의 소모 토큰과 결과물 분량 직접 확인**: 각 대화창에서 `/context`로 사용 토큰을 보고, 생성된 코드 줄 수와 함께 비교합니다.\n\n```bash\nwc -l *.py *.html\n```\n\n2️⃣ **현업 모델 운용 공식 & Zero Harness Tax**:\n- **CursorBench · AA Index 실측 요약**: `Gemini 4 Neon`은 IDE 멀티파일 코딩(**65.4%**)과 종합 지능 지수(**61**) 모두 `Claude Opus 5.5`(**58.1% · 59**)를 앞서면서도 토큰 단가가 **25% 저렴**합니다.\n- **평소 빠른 코딩(`Hydrogen`) ➔ 핵심 기능 구현·복합 버그 해결(`Neon`)**을 기본 주력으로 쓰고, 필요할 때 같은 Antigravity 화면 안에서 **`Claude Opus 5.5`**까지 바로 전환해 비교·검증할 수 있습니다.\n- **Zero Harness Tax**: 주요 코딩 벤치마크(DeepSWE · Terminal-Bench) 기준 전용 CLI 대비 품질 손실 없이 12% 이내 비용 효율을 유지해, 도구 파편화 없이 Antigravity 하나로 표준화합니다.\n\n---\n\n# 🤝 Part 3. 멀티에이전트 분업 · 팀 자산화 & 전환\n\n### 🔹 Step 3-1. `/boost` 깐깐한 교차 검증 & `/teamwork` 파일 나눠 동시에 짜기\n\n> **핵심:** 실수하면 안 되는 핵심 로직은 **짜는 놈·깨보는 놈을 나누는 `/boost`**, 만들어야 할 파일이 여러 개일 때는 **파일별로 담당자를 나눠 동시에 짜는 `/teamwork`**를 씁니다.\n\n![Step 3-1-1 /boost vs /teamwork 멀티에이전트 구조 비교](assets/screenshots/boost_vs_teamwork_architecture.png)\n\n1️⃣ **`/boost` 실습 (구현 에이전트 ➔ 백지 상태의 검증 에이전트가 허점 공격)**:\n\n```text\n/boost 사용자별로 1분에 요청을 10번까지만 허용하는 제한 기능을 짜고, 다른 검증 에이전트가 꼼수나 경계값 테스트를 새로 짜서 깨보며 허점을 보완해줘.\n```\n\n2️⃣ **`/teamwork` 실습 (파일 충돌 없이 역할 나눠 병렬 구현)**: 우측 `Subagents` 패널에서 에이전트들이 각자 맡은 파일만 동시에 작업하고 합치는 모습을 확인합니다.\n\n```text\n/teamwork 로그인 처리 파일, 주문 API 파일, 자동 테스트 파일 3개를 각각 다른 에이전트가 하나씩 맡아 동시에 구현하고 합쳐서 테스트까지 통과시켜줘.\n```\n\n![Step 3-1-2 우측 패널에서 실시간으로 확인하는 멀티에이전트 실행 상태](assets/screenshots/multiagent_boost_teamwork.png)\n\n---\n\n### 🔹 Step 3-2. Global vs Project 규칙(`.md`) 구분 & `/learn` · `/plugin` 팀 자산화\n\n> **핵심:** 매번 프롬프트에 똑같은 주의사항을 복붙하지 않도록, **내 PC 모든 작업에 공통으로 쓸 개인·기본 규칙(`Global`)**과 **이 저장소·하위 폴더에만 적용할 팀 규칙(`Project`)**을 `.md` 파일 위치로 깔끔하게 나눕니다. (충돌 시 **`Project > Global`** 우선 적용)\n\n| 구분 | 파일 경로 (`.md`) | 적용 범위 · 공유 방식 | 현업에서 주로 적는 내용 |\n| :--- | :--- | :--- | :--- |\n| **Global Rules (전역)** | `~/.gemini/config/rules/*.md` | 내 PC 모든 프로젝트 공통 (Git 제외) | 한국어 응답, 간결한 설명 스타일, 비밀키 노출 금지 등 개인 기본 수칙 |\n| **Project Rules (프로젝트)** | `<루트>/AGENTS.md` · `.agents/rules/*.md` | 현재 저장소 한정 (Git으로 팀 공유) | 정산은 `Decimal` 사용, DB 바인딩 강제, 테스트 파일 임의 수정 금지 |\n| **Directory Rules (하위 폴더)** | `backend/AGENTS.md` · `frontend/AGENTS.md` | 해당 하위 폴더 작업 시에만 자동 활성 | 백엔드 전용 API 예외 규격, 프론트엔드 전용 컴포넌트·스타일 규칙 |\n\n- **`rules/*.md` 상단 활성화 옵션(`trigger`)**: 항상 켜둘 핵심 원칙만 **`trigger: always_on`**으로 두고, 특정 작업에만 필요한 가이드는 **`trigger: model_decision`**(`description` 함께 기재)으로 두면 평소 토큰 소모를 아낄 수 있습니다. (`AGENTS.md` / `GEMINI.md`는 별도 설정 없이 해당 폴더에서 항상 적용됩니다.)\n\n1️⃣ **`/learn`으로 현재 프로젝트 전용 규칙(`.agents/rules/*.md`) 자동 생성**:\n\n```text\n/learn 돈이나 수수료를 계산할 때는 float 대신 Decimal을 쓰고 DB 조회문은 항상 바인딩 방식을 쓴다는 내용을 이 프로젝트 규칙으로 저장해줘.\n```\n\n<details class=\"file-list-details\">\n<summary><strong>📄 생성된 프로젝트 규칙(`.agents/rules/*.md`) vs 전역 규칙(`~/.gemini/config/rules/*.md`) 예시 보기</strong></summary>\n\n```markdown\n# [프로젝트 전용] .agents/rules/payment-safety.md  (Git 커밋 → 팀원 전원 적용)\n---\ntrigger: always_on\ndescription: 정산 금액 및 DB 쿼리 안전 수칙\n---\n- 금액·수수료 계산에는 float 대신 반드시 Decimal을 사용한다.\n- 모든 SQL 조회는 파라미터 바인딩 방식으로 작성한다.\n\n# [내 PC 전역] ~/.gemini/config/rules/my-style.md  (내 PC의 모든 프로젝트 공통 적용)\n---\ntrigger: always_on\ndescription: 개인 공통 응답 및 커밋 규칙\n---\n- 설명은 핵심 결론부터 한국어로 간결하게 작성한다.\n- 코드에 API 키나 비밀번호를 직접 적지 않고 환경변수로 읽는다.\n```\n\n</details>\n\n2️⃣ **`/plugin`으로 동료에게 바로 줄 수 있게 묶기**:\n\n```text\n/plugin 방금 저장한 프로젝트 코딩 규칙과 코드 점검 스킬을 묶어서 우리 팀원들에게 바로 공유할 수 있는 플러그인 폴더로 만들어줘.\n```\n\n![Step 3-2 좌측 Customizations 및 플러그인 마켓플레이스 화면](assets/screenshots/customizations_marketplace.png)\n\n3️⃣ **기존 Claude Code 사용자 1:1 전환 매핑**:\n\n| 기존 개념 | Antigravity 대응 | 현장 전환 포인트 |\n| :--- | :--- | :--- |\n| `Slash Commands` | `/grill-me` · `/plan` · `/goal` · `/boost` | 설계 질문부터 자동 테스트 완주·교차검증까지 1줄 호출 |\n| `Global / Project CLAUDE.md` | `~/.gemini/config/rules/*.md` · `AGENTS.md` · `.agents/rules/*.md` | 전역·프로젝트·하위 폴더 계층 그대로 대응 (`Project > Global`) + `/learn` 자동 저장 |\n| `Skills · Hooks · Plugin` | `.agents/skills/` · `.agents/hooks.json` | 검증된 스킬과 안전장치를 폴더 하나로 묶어 팀 공유 |\n| 단일 모델 고정 | `Neon · Hydrogen · Gluon (+ Opus 5.5)` | 주력 설계·구현은 `Neon`, 고속 반복 수정은 `Hydrogen`, 교차 비교는 `Opus 5.5` |\n\n---\n\n# 🛡️ Part 4. 보안 Hook 가드레일 & 사내 MCP 정책\n\n### 🔹 Step 4-1. Hook 설정법 (위험 명령어 · `.env` 접근 자동 차단기)\n\n> **핵심:** 문서로 적는 `Rule`은 가끔 무시될 수 있지만, **`Hook`(`.agents/hooks.json`)은 명령어 실행 직전(`PreToolUse`)에 스크립트가 먼저 검사해 파괴적 명령과 `.env` 시크릿 노출을 100% 코드 레벨에서 막아주는 안전장치**입니다.\n\n| 주요 시점 | 언제 도나? | 현업에서 주로 쓰는 곳 |\n| :--- | :--- | :--- |\n| **`PreToolUse`** | 터미널 명령·파일 도구 실행 직전 | `rm -rf`, `DROP TABLE`, `git push --force`, **`.env` 읽기·출력** 자동 차단 |\n| **`PostToolUse`** | 파일 수정이나 명령이 끝난 직후 | 코드 고친 뒤 자동으로 포맷터·린터 돌려 문법 정리 |\n| **`SessionStart` / `Stop`** | 대화 시작할 때 / 작업 끝날 때 | 사내 환경변수 확인, 작업 내역 감사 로그 남기기 |\n\n1️⃣ **복잡한 JSON 문법을 외울 필요 없이 에이전트에게 말로 시켜 바로 세팅합니다**:\n\n```text\n터미널 명령이나 파일 조회를 실행하기 전에 rm -rf, DROP TABLE, git push --force 또는 .env 파일 접근이 들어있으면 자동으로 실행을 막아주는 .agents/hooks.json 설정과 파이썬 차단 스크립트를 만들어줘.\n```\n\n<details class=\"file-list-details\">\n<summary><strong>📄 생성된 `.agents/hooks.json` 구조 참고하기 (클릭하여 펼치기)</strong></summary>\n\n```python\n# .agents/hooks.json\n{\n  \"safety-guard\": {\n    \"PreToolUse\": [{\n      \"matcher\": \"run_command|read_file\",\n      \"hooks\": [{ \"type\": \"command\", \"command\": \"python3 ./guard.py\", \"timeout\": 5 }]\n    }]\n  }\n}\n# 스크립트 표준 출력으로 {\"decision\": \"deny\", \"reason\": \"차단 사유\"} 를 내보내면 즉시 실행이 취소됩니다.\n```\n\n</details>\n\n2️⃣ **정말 막히는지 바로 시험해보기**:\n\n```text\n방금 걸어둔 차단이 잘 작동하는지 보게 DROP TABLE users 나 .env 내용이 포함된 테스트 명령을 터미널에서 한 번 실행해봐.\n```\n\n---\n\n### 🔹 Step 4-2. 기업 환경에서의 사내 MCP 보안 정책 (화이트리스트 안내)\n\n> **핵심:** 엔터프라이즈 보안 환경에서는 **개발자 PC에서 임의의 로컬 MCP 서버를 직접 띄워 연결하는 방식이 제한**되며, 관리자가 사전 검토·승인한 사내 공용 MCP만 화이트리스트로 안전하게 연동합니다.\n\n| 구분 | 기업 보안 정책 | 비고 |\n| :--- | :--- | :--- |\n| **개인 로컬 MCP 서버** | **기본 차단 (실습 제외)** | 미검증 로컬 프로세스 실행 및 사내 데이터 유출 방지 |\n| **사내 승인 공용 MCP** | **관리자 화이트리스트 허용** | 콘솔 **`Allowed server configuration`**에 등록된 사내 공식 MCP만 연결 |\n\n- **확인 메뉴**: 승인된 사내 MCP가 배포된 환경에서는 화면 우측 상단 **`Additional Options (...)` ➔ `MCP Servers`**에서 허용된 서버와 도구 목록을 확인할 수 있습니다.\n\n---\n\n# 🖥️ Part 5. Gemini 데스크탑 앱 미리보기\n\n### 🔹 Step 5-1. 코딩은 Antigravity, 일반 업무는 Gemini 데스크탑\n\n> **핵심:** 코드 짜고 디버깅하는 일은 **Antigravity**에서, 메일 정리·회의 준비·보고서 초안 같은 일상 업무는 깔끔한 **Gemini 데스크탑 앱(및 웹)**에서 나눠 씁니다.\n\n![Step 5-1 일반 업무용 Gemini 데스크탑 앱 화면](assets/screenshots/gemini_desktop_surface.png)\n\n1️⃣ **좌측 메뉴 4가지 핵심 역할**:\n- **`Tasks`**: 시켜둔 업무 중 진행 중이거나 내 확인을 기다리는 작업 목록\n- **`Scheduled`**: 매일 아침 메일 브리핑·주간 동향 정리처럼 정해진 시간에 자동 실행되는 루틴\n- **`Customize`**: 자주 쓰는 `Skills` · `Memory` · 사내 앱(메일, 캘린더, 드라이브, Jira 등) 연결\n- **`Projects`**: 부서 문서와 기획서를 폴더별로 모아 두고 같은 맥락에서 계속 대화\n\n2️⃣ **실무자가 가장 많이 쓰는 일상 업무 3가지**:\n- **메일함 우선순위 정리 (`Triage my inbox`)**: 당장 답장할 메일과 나중에 볼 참고 메일 분류\n- **내일 회의 미리 준비 (`Prep me for tomorrow`)**: 내일 일정과 관련 문서를 엮어 핵심 안건 요약\n- **할 일 빠짐없이 모으기 (`Find my action items`)**: 메일·채팅·회의록에 흩어진 내 담당 할 일 추출\n\n---\n\n### 🔹 Step 5-2. 같은 `SKILL.md` 표준으로 개발팀과 현업 연결\n\n1️⃣ **코딩 몰라도 30초 만에 만드는 업무용 `Skill`**:\n- `Skills ➔ + Create skill`에서 **`① 이름` · `② 설명` · `③ 안내`** 3칸만 적으면 바로 `/my-skill` 단축키로 불러 쓸 수 있습니다.\n![Step 5-2 화면에서 텍스트로 바로 등록하는 업무용 Skill](assets/screenshots/ge_skill_create_text.png)\n\n2️⃣ **개발팀이 만든 스킬·보안 기준을 전사가 그대로 활용**:\n- 개발팀이 Antigravity에서 만든 `SKILL.md` 파일과 사내 MCP · 게이트웨이 보안 정책이 **Gemini 데스크탑과 웹에서도 똑같은 규격으로 동작**해, 개발 조직의 결과물을 전사 업무 자동화로 바로 넓힐 수 있습니다.";

      if (t.includes('Step 2-1B')) return '2-1B. 3D 샘플 갤러리';
      if (t.includes('Step 2-1')) return '2-1. 3종 모델 & 3D 비교';
      if (t.includes('Step 2-2')) return '2-2. 3모델 현업 과제 3선';
      if (t.includes('Step 2-3')) return '2-3. Cursor·Arena·AA 비교';
      if (t.includes('Part 3.')) return '🤝 Part 3. 멀티에이전트·전환';
      if (t.includes('Step 3-1')) return '3-1. /boost & /teamwork';
      if (t.includes('Step 3-2')) return '3-2. Global/Project 규칙·플러그인';
      if (t.includes('Part 4.')) return '🛡️ Part 4. 보안 Hook·MCP 정책';
      if (t.includes('Step 4-1')) return '4-1. 위험 명령·.env 차단 Hook';
      if (t.includes('Step 4-2')) return '4-2. 사내 승인 MCP 정책';
      if (t.includes('Part 5.')) return '🖥️ Part 5. Gemini 데스크탑';
      if (t.includes('Step 5-1')) return '5-1. 데스크탑 앱 미리보기';
      if (t.includes('Step 5-2')) return '5-2. 전사 Skill 표준 연결';
      return t.slice(0, 22);
    }

    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      document.getElementById('progress-bar').style.width = (height > 0 ? (winScroll / height) * 100 : 0) + '%';
      updateActiveToc();
    });

    function initPortal() {
      const container = document.getElementById('markdown-container');
      let md = EMBEDDED_MD.replace(/^# .+\n+/, '');
      container.innerHTML = marked.parse(md);
      enhanceHeadingsAndSections(container);
      enhancePromptCards(container);
      enhanceScreenshots(container);
      buildToc();
    }

    function enhanceHeadingsAndSections(container) {
      const children = Array.from(container.children);
      let currentPart = 'intro';

      children.forEach(el => {
        if (el.tagName === 'H1') {
          const txt = el.textContent;
          if (txt.includes('Part 0')) currentPart = 'part-0';
          else if (txt.includes('Part 1')) currentPart = 'part-1';
          else if (txt.includes('Part 2')) currentPart = 'part-2';
          else if (txt.includes('Part 3')) currentPart = 'part-3';
          else if (txt.includes('Part 4')) currentPart = 'part-4';
          else if (txt.includes('Part 5')) currentPart = 'part-5';
          else currentPart = 'intro';
        }
        el.setAttribute('data-part', currentPart);
      });

      const headings = container.querySelectorAll('h1, h2, h3');
      headings.forEach((h, idx) => {
        const rawText = h.textContent.trim();
        h.id = 'step-' + idx;
        h.setAttribute('data-short-label', getShortMenuLabel(rawText));

        if (h.tagName === 'H3' && rawText.includes('Step')) {
          const match = rawText.match(/(Step\s+[0-9\-]+)/i);
          const pillText = match ? match[1].toUpperCase() : 'STEP';
          const cleanTitle = rawText.replace(/^🔹\s*Step\s+[0-9\-]+\.\s*/i, '');
          h.innerHTML = `
            <span class="step-pill">${pillText}</span>
            <span style="flex:1;">${cleanTitle}</span>
          `;
        }
      });
    }

    function enhancePromptCards(container) {
      container.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        const lang = code ? (code.className || '') : '';
        const isScript = lang.includes('python') || lang.includes('bash');
        const isMdFile = lang.includes('markdown');
        const part = pre.getAttribute('data-part') || (pre.closest('[data-part]') ? pre.closest('[data-part]').getAttribute('data-part') : '');

        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper ' + ((isScript || isMdFile) ? 'code-script' : 'prompt-card');
        if (part) wrapper.setAttribute('data-part', part);

        const header = document.createElement('div');
        header.className = 'code-block-header';
        let labelHtml = isScript ? '💻 터미널 명령어 / 설정 규약' : '✨ 대화창에 그대로 복사해 붙여넣을 프롬프트';
        let btnTxt = isScript ? '내용 복사' : '프롬프트 복사';

        if (!isScript && !isMdFile && code) {
          const rawPrompt = code.textContent.trim();
          const multiTokenMatch = rawPrompt.match(/^((?:[\/@][a-zA-Z0-9_.\-:]+\s+)+)([\s\S]+)$/);

          if (multiTokenMatch) {
            const tokens = multiTokenMatch[1].trim().split(/\s+/);
            const promptBody = multiTokenMatch[2].replace(/\s*\n\s*/g, ' ').trim();
            pre.setAttribute('data-copy-text', promptBody);

            code.textContent = '';
            tokens.forEach(tok => {
              const chipSpan = document.createElement('span');
              chipSpan.className = 'ag-skill-chip';
              chipSpan.setAttribute('data-cmd', tok);
              chipSpan.setAttribute('data-kbd', 'Tab ⇥');
              chipSpan.setAttribute('title', '복사되지 않는 칩입니다. 입력창에 ' + tok + ' 타이핑 후 Tab 키를 눌러주세요.');
              code.appendChild(chipSpan);
            });
            const bodySpan = document.createElement('span');
            bodySpan.textContent = promptBody;
            code.appendChild(bodySpan);

            const headerChips = tokens.map(tok => `<span class="ag-header-chip">${tok}</span>`).join(' ');
            labelHtml = `⌨️ 입력창에 ${headerChips} <span class="ag-header-kbd">Tab ⇥</span> 선택 ➔ 뒷문장 복붙`;
            btnTxt = '뒷문장만 복사';
          } else if (rawPrompt.includes('\n- ')) {
            code.textContent = rawPrompt;
            pre.setAttribute('data-copy-text', rawPrompt);
          } else {
            const joined = rawPrompt.replace(/\s*\n\s*/g, ' ').trim();
            code.textContent = joined;
            pre.setAttribute('data-copy-text', joined);
          }
        }

        header.innerHTML = `
          <span>${labelHtml}</span>
          <button class="code-copy-btn" onclick="copyBlock(this)">📋 ${btnTxt}</button>
        `;
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);

        if (isScript && window.hljs && code) hljs.highlightElement(code);
      });
    }

    function copyBlock(btn) {
      const pre = btn.closest('.code-block-wrapper').querySelector('pre');
      const textToCopy = pre.getAttribute('data-copy-text') || pre.innerText.trim();
      navigator.clipboard.writeText(textToCopy);
      const orig = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = '✅ 복사 완료!';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1800);
    }

    function enhanceScreenshots(container) {
      container.querySelectorAll('a[href*="./demos/"]').forEach(a => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
      container.querySelectorAll('img').forEach(img => {
        const alt = img.getAttribute('alt') || '실습 화면 가이드';
        const src = img.getAttribute('src');
        const fig = document.createElement('div');
        fig.className = 'screenshot-figure';
        const pPart = img.closest('[data-part]');
        if (pPart) fig.setAttribute('data-part', pPart.getAttribute('data-part'));

        fig.innerHTML = `
          <div class="screenshot-frame" onclick="openLightbox('${src}')">
            <img src="${src}" alt="${alt}" loading="lazy">
            <span class="zoom-hint">🔍 클릭하여 크게 보기</span>
          </div>
          <div class="screenshot-caption">👆 ${alt}</div>
        `;
        const parentP = img.parentElement;
        if (parentP && parentP.tagName === 'P' && parentP.childNodes.length === 1) {
          parentP.replaceWith(fig);
        } else {
          img.replaceWith(fig);
        }
      });
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }

    function buildToc() {
      const toc = document.getElementById('toc-container');
      toc.innerHTML = '';

      const introGroup = document.createElement('div');
      introGroup.className = 'toc-group-label';
      introGroup.textContent = '🗺️ 개요 & 초기 세팅';
      toc.appendChild(introGroup);

      allSections = Array.from(document.querySelectorAll('#markdown-container h1, #markdown-container h2, #markdown-container h3'));

      allSections.forEach(h => {
        const shortLabel = h.getAttribute('data-short-label') || h.textContent.trim();
        if (h.tagName === 'H1') {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'toc-group-label';
          groupDiv.textContent = shortLabel;
          groupDiv.onclick = () => { h.scrollIntoView({ behavior: 'smooth' }); };
          toc.appendChild(groupDiv);
          return;
        }

        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.className = 'toc-link';
        a.setAttribute('data-part', h.getAttribute('data-part') || 'all');
        a.textContent = shortLabel;
        a.title = shortLabel;
        toc.appendChild(a);
      });
    }

    function filterToc(q) {
      const query = q.toLowerCase();
      document.querySelectorAll('.toc-link').forEach(a => {
        a.style.display = a.textContent.toLowerCase().includes(query) ? 'flex' : 'none';
      });
    }

    function filterPart(partId, btn) {
      document.querySelectorAll('.part-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('#markdown-container > [data-part]').forEach(el => {
        if (partId === 'all' || el.getAttribute('data-part') === partId || (partId === 'part-0' && el.getAttribute('data-part') === 'intro')) {
          el.style.display = '';
        } else {
          el.style.display = 'none';
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateActiveToc() {
      let currentId = '';
      allSections.forEach(h => {
        if (h.offsetParent !== null && window.scrollY >= h.offsetTop - 160) {
          currentId = h.id;
        }
      });
      document.querySelectorAll('.toc-link').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + currentId);
      });
    }

    initPortal();
  </script>
</body>
</html>

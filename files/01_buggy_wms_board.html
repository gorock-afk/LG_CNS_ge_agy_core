<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물류센터 입출고 작업 보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif; background: #F3F4F6; color: #111827; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: #6B7280; font-size: 13px; margin-bottom: 16px; }
    .panel { background: #fff; border: 1px solid #E5E7EB; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    .panel h2 { font-size: 14px; margin-bottom: 10px; color: #374151; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .form-row label { font-size: 12px; color: #6B7280; display: flex; flex-direction: column; gap: 4px; }
    input, select { border: 1px solid #D1D5DB; border-radius: 6px; padding: 7px 9px; font-size: 13px; min-width: 110px; }
    button { border: 1px solid #174EA6; background: #174EA6; color: #fff; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button.ghost { background: #fff; color: #174EA6; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 6px; padding: 10px 12px; }
    .stat .k { font-size: 12px; color: #6B7280; }
    .stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .col { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px; min-height: 120px; }
    .col h3 { font-size: 12px; color: #374151; margin-bottom: 6px; }
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 12px; }
    .card b { font-size: 13px; }
    .card .meta { color: #6B7280; margin: 3px 0 6px; }
    .card.overdue { border-color: #F59E0B; background: #FFFBEB; }
    .card button { padding: 3px 8px; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { border-bottom: 1px solid #E5E7EB; padding: 6px 8px; text-align: left; }
    th { color: #6B7280; font-weight: 600; }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; }
    #selftest-summary { font-weight: 700; padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; display: none; }
    #selftest-summary.pass { display: block; background: #E6F4EA; color: #0D652D; }
    #selftest-summary.fail { display: block; background: #FCE8E6; color: #A50E0E; }
    #selftest-list li { font-size: 12.5px; list-style: none; padding: 3px 0; font-family: Consolas, monospace; }
    #selftest-list li.ok { color: #0D652D; }
    #selftest-list li.ng { color: #A50E0E; }
  </style>
</head>
<body>
  <h1>물류센터 입출고 작업 보드</h1>
  <p class="sub">출고 오더를 등록하고 대기 → 피킹 → 검수 → 출고 단계로 처리합니다. (실습용 샘플 · 외부 라이브러리 없음)</p>

  <div class="panel">
    <h2>작업 등록</h2>
    <div class="form-row">
      <label>SKU <input id="sku-input" placeholder="예: BOX-A100" /></label>
      <label>수량 <input id="qty-input" type="number" min="1" value="1" /></label>
      <label>구역
        <select id="zone-select">
          <option>미배정</option><option>A</option><option>B</option><option>C</option>
        </select>
      </label>
      <label>긴급도(1~10)
        <select id="priority-select">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </label>
      <label>납기일 <input id="due-input" type="date" /></label>
      <button id="add-btn">작업 추가</button>
      <button id="auto-assign-btn" class="ghost">구역 자동 배정</button>
      <button id="selftest-btn" class="ghost">자가 테스트 실행</button>
    </div>
  </div>

  <div class="panel">
    <h2>현황</h2>
    <div class="stats">
      <div class="stat"><div class="k">총 수량</div><div class="v" id="stat-total-qty">0</div></div>
      <div class="stat"><div class="k">출고 완료율</div><div class="v" id="stat-done-rate">0%</div></div>
      <div class="stat"><div class="k">납기 지연</div><div class="v" id="stat-overdue">0</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>작업 보드</h2>
    <div class="board" id="board"></div>
  </div>

  <div class="panel">
    <h2>긴급도 순 목록</h2>
    <table>
      <thead><tr><th>#</th><th>SKU</th><th>수량</th><th>구역</th><th>긴급도</th><th>납기일</th><th>상태</th></tr></thead>
      <tbody id="list-body"></tbody>
    </table>
    <div class="pager">
      <button id="prev-btn" class="ghost">이전</button>
      <span id="page-label">1 / 1</span>
      <button id="next-btn" class="ghost">다음</button>
    </div>
  </div>

  <div class="panel">
    <h2>자가 테스트 결과</h2>
    <div id="selftest-summary"></div>
    <ul id="selftest-list"></ul>
  </div>

  <script>
    // ------------------------------------------------------------------
    // 상태
    // ------------------------------------------------------------------
    var STAGES = ['대기', '피킹', '검수', '출고'];
    var ZONES = ['A', 'B', 'C'];
    var PAGE_SIZE = 5;
    var state = { orders: [], nextId: 1, page: 0 };

    // ------------------------------------------------------------------
    // 도메인 로직
    // ------------------------------------------------------------------
    function createOrder(input) {
      var order = {
        id: state.nextId++,
        sku: input.sku,
        qty: input.qty,
        zone: input.zone || '미배정',
        priority: input.priority,
        due: input.due,
        stage: '대기'
      };
      state.orders.push(order);
      return order;
    }

    function addOrderFromForm() {
      var sku = document.getElementById('sku-input').value.trim();
      var qty = document.getElementById('qtyInput').value;
      var zone = document.getElementById('zone-select').value;
      var priority = document.getElementById('priority-select').value;
      var due = document.getElementById('due-input').value;
      if (!sku) { return null; }
      var order = createOrder({ sku: sku, qty: qty, zone: zone, priority: priority, due: due });
      render();
      return order;
    }

    function advance(id) {
      var order = state.orders.find(function (o) { return o.id === id; });
      if (!order) { return; }
      var idx = STAGES.indexOf(order.stage);
      if (idx < STAGES.length - 1) { order.stage = STAGES[idx + 1]; }
      render();
    }

    function totalQty() {
      return state.orders.reduce(function (sum, o) { return sum + o.qty; }, 0);
    }

    function doneRate() {
      var done = state.orders.filter(function (o) { return o.stage === '출고'; }).length;
      return Math.round(done / state.orders.length * 100);
    }

    // 미배정 오더를 A → B → C 순서로 돌아가며 배정한다.
    // 구역 배정 API 호출을 흉내 내기 위해 건별로 지연을 둔다.
    function autoAssignZones() {
      var pending = state.orders.filter(function (o) { return o.zone === '미배정'; });
      for (var i = 0; i < pending.length; i++) {
        var order = pending[i];
        setTimeout(function () {
          order.zone = ZONES[i % ZONES.length];
          render();
        }, 10 * (i + 1));
      }
      return new Promise(function (resolve) {
        setTimeout(resolve, 10 * (pending.length + 2));
      });
    }

    // 긴급도가 높은 순(10 → 1)으로 정렬한 목록을 돌려준다.
    function sortedByPriority() {
      return state.orders.sort(function (a, b) {
        return a.priority < b.priority ? 1 : -1;
      });
    }

    function pageSlice(list, page, size) {
      return list.slice(page * size + 1, (page + 1) * size + 1);
    }

    function pageCount(list, size) {
      return Math.max(1, Math.ceil(list.length / size));
    }

    // 납기일(YYYY-MM-DD) 당일 밤 12시가 지나야 지연으로 본다.
    function isOverdue(dueStr, now) {
      if (!dueStr) { return false; }
      return now > new Date(dueStr);
    }

    // ------------------------------------------------------------------
    // 렌더링
    // ------------------------------------------------------------------
    function render() {
      var now = new Date();
      document.getElementById('stat-total-qty').textContent = totalQty();
      document.getElementById('stat-done-rate').textContent = doneRate() + '%';
      document.getElementById('stat-overdue').textContent = state.orders.filter(function (o) {
        return o.stage !== '출고' && isOverdue(o.due, now);
      }).length;

      var board = document.getElementById('board');
      board.innerHTML = '';
      STAGES.forEach(function (stage) {
        var col = document.createElement('div');
        col.className = 'col';
        var items = state.orders.filter(function (o) { return o.stage === stage; });
        col.innerHTML = '<h3>' + stage + ' (' + items.length + ')</h3>';
        items.forEach(function (o) {
          var card = document.createElement('div');
          card.className = 'card' + (o.stage !== '출고' && isOverdue(o.due, now) ? ' overdue' : '');
          card.innerHTML = '<b>' + o.sku + '</b><div class="meta">수량 ' + o.qty + ' · 구역 ' + o.zone +
            ' · 긴급도 ' + o.priority + '</div>';
          if (stage !== '출고') {
            var btn = document.createElement('button');
            btn.textContent = '다음 단계';
            btn.onclick = function () { advance(o.id); };
            card.appendChild(btn);
          }
          col.appendChild(card);
        });
        board.appendChild(col);
      });

      var sorted = sortedByPriority();
      var pages = pageCount(sorted, PAGE_SIZE);
      if (state.page > pages - 1) { state.page = pages - 1; }
      var rows = pageSlice(sorted, state.page, PAGE_SIZE);
      var body = document.getElementById('list-body');
      body.innerHTML = '';
      rows.forEach(function (o) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + o.id + '</td><td>' + o.sku + '</td><td>' + o.qty + '</td><td>' + o.zone +
          '</td><td>' + o.priority + '</td><td>' + (o.due || '-') + '</td><td>' + o.stage + '</td>';
        body.appendChild(tr);
      });
      document.getElementById('page-label').textContent = (state.page + 1) + ' / ' + pages;
    }

    // ------------------------------------------------------------------
    // 자가 테스트 (이 블록은 수정하지 않습니다)
    // ------------------------------------------------------------------
    function assertEqual(actual, expected, label) {
      var a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a !== e) { throw new Error(label + ' — 기대값 ' + e + ', 실제값 ' + a); }
    }

    var SELF_TESTS = [
      ['T1 폼 입력으로 작업 추가', function () {
        document.getElementById('sku-input').value = 'BOX-T1';
        document.getElementById('qty-input').value = '7';
        var order = addOrderFromForm();
        assertEqual(state.orders.length, 1, '등록 건수');
        assertEqual(order.sku, 'BOX-T1', 'SKU');
      }],
      ['T2 총 수량은 숫자 합계', function () {
        createOrder({ sku: 'A', qty: '12', zone: 'A', priority: '3', due: '' });
        createOrder({ sku: 'B', qty: '30', zone: 'B', priority: '5', due: '' });
        assertEqual(totalQty(), 42, '총 수량');
      }],
      ['T3 빈 보드의 완료율은 0', function () {
        assertEqual(doneRate(), 0, '완료율');
      }],
      ['T4 구역 자동 배정은 A→B→C 순환', async function () {
        ['S1', 'S2', 'S3', 'S4'].forEach(function (sku) {
          createOrder({ sku: sku, qty: 1, zone: '미배정', priority: '1', due: '' });
        });
        await autoAssignZones();
        assertEqual(state.orders.map(function (o) { return o.zone; }), ['A', 'B', 'C', 'A'], '배정 결과');
      }],
      ['T5 긴급도는 숫자 기준 내림차순 · 원본 순서 유지', function () {
        ['9', '10', '2', '10'].forEach(function (p, i) {
          createOrder({ sku: 'P' + i, qty: 1, zone: 'A', priority: p, due: '' });
        });
        var sorted = sortedByPriority();
        assertEqual(sorted.map(function (o) { return o.sku; }), ['P1', 'P3', 'P0', 'P2'], '정렬 결과');
        assertEqual(state.orders.map(function (o) { return o.sku; }), ['P0', 'P1', 'P2', 'P3'], '원본 순서');
      }],
      ['T6 페이지를 넘겨도 누락·중복 없음', function () {
        var list = [1, 2, 3, 4, 5, 6, 7];
        var seen = [];
        for (var p = 0; p < pageCount(list, 3); p++) { seen = seen.concat(pageSlice(list, p, 3)); }
        assertEqual(seen, list, '전체 페이지 합');
      }],
      ['T7 납기 당일은 지연 아님', function () {
        assertEqual(isOverdue('2026-11-16', new Date(2026, 10, 16, 23, 30)), false, '당일 23:30');
        assertEqual(isOverdue('2026-11-16', new Date(2026, 10, 17, 0, 30)), true, '다음 날 00:30');
        assertEqual(isOverdue('', new Date(2026, 10, 17, 0, 30)), false, '납기 미입력');
      }]
    ];

    async function runSelfTest() {
      var saved = state;
      var results = [];
      for (var t = 0; t < SELF_TESTS.length; t++) {
        state = { orders: [], nextId: 1, page: 0 };
        try {
          await SELF_TESTS[t][1]();
          results.push({ name: SELF_TESTS[t][0], ok: true });
        } catch (err) {
          results.push({ name: SELF_TESTS[t][0], ok: false, message: String(err && err.message || err) });
        }
      }
      state = saved;
      try { render(); } catch (err) { /* 화면 렌더링 오류는 개별 테스트에서 드러난다 */ }

      var failed = results.filter(function (r) { return !r.ok; }).length;
      var summary = document.getElementById('selftest-summary');
      summary.className = failed === 0 ? 'pass' : 'fail';
      summary.textContent = failed === 0
        ? 'ALL PASS (' + results.length + '/' + results.length + ')'
        : failed + ' FAIL / ' + results.length;
      summary.setAttribute('data-failed', String(failed));
      var list = document.getElementById('selftest-list');
      list.innerHTML = '';
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'ok' : 'ng';
        li.textContent = (r.ok ? '[PASS] ' : '[FAIL] ') + r.name + (r.ok ? '' : ' :: ' + r.message);
        list.appendChild(li);
      });
      return results;
    }

    // ------------------------------------------------------------------
    // 이벤트 연결
    // ------------------------------------------------------------------
    document.getElementById('add-btn').addEventListener('click', addOrderFromForm);
    document.getElementById('auto-assign-btn').addEventListener('click', autoAssignZones);
    document.getElementById('selftest-btn').addEventListener('click', runSelfTest);
    document.getElementById('prev-btn').addEventListener('click', function () {
      if (state.page > 0) { state.page--; render(); }
    });
    document.getElementById('next-btn').addEventListener('click', function () {
      state.page++; render();
    });

    try { render(); } catch (err) { console.error(err); }
    if (location.search.indexOf('selftest=1') >= 0) { runSelfTest(); }
  </script>
</body>
</html>
